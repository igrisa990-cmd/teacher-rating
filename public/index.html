<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#635bff">
  <meta name="description" content="Учитель+ — современная платформа отзывов об учителях и школах">
  <title>Учитель+ — выбирай тех, кто вдохновляет</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/runtime-config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--bg:#f6f7fb;--surface:#fff;--surface2:#f0f1f7;--text:#151726;--muted:#6f7385;--line:#e5e7ef;--brand:#635bff;--brand2:#8b5cf6;--green:#10a981;--amber:#f1aa2d;--red:#e55353;--shadow:0 24px 70px rgba(34,38,70,.12);--soft-shadow:0 10px 34px rgba(34,38,70,.07);--radius:24px}

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px Manrope,system-ui,sans-serif;transition:background .25s,color .25s}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent);outline-offset:2px}.wrap{width:min(1200px,calc(100% - 40px));margin:auto}.muted{color:var(--muted)}.hidden{display:none!important}
    header{position:sticky;top:0;z-index:40;padding:12px 0;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px)}nav{min-height:66px;padding:8px 10px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:var(--soft-shadow)}.logo{border:0;background:transparent;color:var(--text);font-size:20px;font-weight:800;letter-spacing:-.8px;padding:10px 12px;white-space:nowrap}.logo b{color:var(--brand)}.navlinks{display:flex;gap:2px}.navbtn,.iconbtn,.soft,.primary,.ghost{border:0;border-radius:13px;font-weight:700;transition:.18s}.navbtn{background:transparent;color:var(--muted);padding:11px 12px}.navbtn:hover,.navbtn.active{color:var(--text);background:var(--surface2)}.primary{padding:12px 17px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 22px rgba(99,91,255,.23)}.primary:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(99,91,255,.3)}.soft{padding:11px 15px;color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,var(--surface))}.ghost{padding:10px 13px;color:var(--text);background:transparent;border:1px solid var(--line)}.iconbtn{width:42px;height:42px;background:var(--surface2);color:var(--text)}.search{position:relative;flex:1;max-width:410px;margin-left:auto}.searchbox{height:46px;display:flex;align-items:center;gap:9px;padding:0 14px;border:1px solid transparent;border-radius:14px;background:var(--surface2)}.searchbox:focus-within{border-color:color-mix(in srgb,var(--brand) 35%,var(--line));background:var(--surface)}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.suggest{display:none;position:absolute;top:53px;left:0;right:0;padding:7px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow);max-height:380px;overflow:auto}.suggest.show{display:block}.suggest button{width:100%;border:0;border-     main{min-height:calc(100vh - 90px)}.page{animation:enter .32s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{position:relative;overflow:hidden;padding:86px 0 42px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}.hero:before{width:470px;height:470px;right:-90px;top:-80px;background:radial-gradient(circle,#9089ff44,transparent 68%);animation:float 8s ease-in-out infinite}.hero:after{width:390px;height:390px;left:-130px;bottom:-160px;background:radial-gradient(circle,#34d6aa33,transparent 68%);animation:float 10s ease-in-out infinite reverse}@keyframes float{50%{transform:translate(18px,20px) scale(1.05)}}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));border-radius:999px;color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface));font-size:11px;font-weight:800;letter-spacing:.11em}.hero h1{position:relative;max-width:910px;margin:22px 0 20px;font-size:clamp(48px,7.3vw,88px);line-height:.97;letter-spacing:-5px}.gradient{background:linear-gradient(100deg,var(--brand),#a855f7 50%,var(--green));-webkit-background-clip:text;color:transparent}.lead{max-width:680px;font-size:19px;line-height:1.7;color:var(--muted)}.heroSearch{position:relative;display:flex;gap:10px;max-width:780px;margin-top:31px}.heroSearch .searchbox{height:60px;flex:1;padding:0 19px;background:var(--surface);border-color:var(--line);box-shadow:var(--soft-shadow)}.heroSearch .primary{min-width:140px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.quick button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:7px}.quick button:hover{color:var(--brand)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:22px 0 56px}.metric{padding:21px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:var(--soft-shadow)}.metric b{display:block;font-size:28px;letter-spacing:-1px}.metric span{color:var(--muted);font-size:13px}.section{padding:56px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:23px}.sectionHead h1,.sectionHead h2{margin:6px 0;font-size:clamp(30px,4vw,44px);letter-spacing:-1.8px}.sectionHead p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;padding:21px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--soft-shadow);transition:transform .2s,box-shadow .2s,border .2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--brand) 20%,var(--line))}.teacherTop{display:flex;gap:14px}.avatar{flex:0 0 auto;width:55px;height:55px;display:grid;place-items:center;border-radius:17px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--brand),#9d8cff);box-shadow:0 9px 22px rgba(99,91,255,.2)}.card h3{margin:2px 0 5px;font-size:17px}.rating{color:var(--amber);font-weight:800}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700}.cardActions{display:flex;gap:8px;margin-top:18px}.cardActions button:first-child{flex:1}.heart{position:absolute;right:16px;top:16px;width:37px;height:37px;border:0;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:17px}.heart.on{color:#fff;background:var(--red)}

    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filterInput,.filterSelect{height:46px;border:1px solid var(--line);border-radius:13px;padding:0 14px;background:var(--surface);color:var(--text)}.filterInput{flex:1;min-width:220px}.filterSelect{min-width:150px}.resultCount{margin-left:auto;align-self:center;color:var(--muted)}.schoolCard{cursor:pointer;overflow:hidden}.schoolCover{height:115px;margin:-21px -21px 18px;padding:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,var(--surface2)),color-mix(in srgb,var(--green) 17%,var(--surface2)));display:flex;align-items:flex-end}.schoolIcon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:var(--surface);font-size:22px;box-shadow:var(--soft-shadow)}.schoolStats{display:flex;justify-content:space-between;margin-top:17px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.schoolStats b{display:block;color:var(--text);font-size:17px}.empty{grid-column:1/-1;padding:55px;text-align:center;border:1px dashed var(--line);border-radius:22px;background:var(--surface);color:var(--muted)}
    .detail{padding:35px 0 70px}.back{margin-bottom:15px}.profileHero{position:relative;overflow:hidden;padding:32px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--brand) 9%,var(--surface)) 60%,color-mix(in srgb,var(--green) 9%,var(--surface)));box-shadow:var(--shadow)}.profileHero:after{content:"";position:absolute;width:250px;height:250px;right:-80px;top:-100px;border-radius:50%;background:#ffffff40}.profileTop{position:relative;z-index:1;display:flex;align-items:center;gap:21px}.profileTop .avatar{width:92px;height:92px;border-radius:27px;font-size:27px}.profileTitle{flex:1}.profileTitle h1{margin:0;font-size:clamp(32px,5vw,52px);letter-spacing:-2.2px}.profileTitle p{margin:7px 0}.profileActions{display:flex;gap:8px;flex-wrap:wrap}.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:27px}.stat{padding:17px;border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:18px;background:color-mix(in srgb,var(--surface) 72%,transparent)}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.detailGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:17px;margin-top:17px}.panel{padding:24px;border:1px solid var(--line);border-radius:23px;background:var(--surface);box-shadow:var(--soft-shadow)}.panel h2,.panel h3{margin-top:0}.bio{font-size:16px;line-height:1.75}.review{padding:17px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}.reviewHead{display:flex;justify-content:space-between;gap:10px}.distribution{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:25px 1fr 32px;align-items:center;gap:8px;font-size:12px}.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amber),#ffd36a)}
    .communityHero{padding:32px;border-radius:30px;color:#fff;background:radial-gradient(400px 200px at 90% 0,#22c59a55,transparent),linear-gradient(135deg,#20243b,#343961)}.communityHero h1{font-size:45px;margin:8px 0}.communityGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.communityCard{text-align:center}.communityCard .avatar{margin:0 auto 13px;border-radius:50%}.rank{font-size:12px;color:var(--brand);font-weight:800}.dashboard{display:grid;grid-template-columns:260px 1fr;gap:17px}.side{padding:20px}.side button{width:100%;text-align:left;margin:3px 0}.profileCard{text-align:center}.profileCard .avatar{margin:0 auto 12px;width:78px;height:78px;border-radius:24px}.savedGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:18px;background:#080a1299;backdrop-filter:blur(8px)}.modal.open{display:grid}.modalbox{width:min(520px,100%);max-height:92vh;overflow:auto;padding:27px;border:1px solid var(--line);border-radius:25px;background:var(--surface);box-shadow:var(--shadow)}.modalbox.wide{width:min(900px,100%)}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:15px}.modalhead h2{margin:0}.close{width:38px;height:38px;border:0;border-radius:12px;background:var(--surface2);color:var(--text);font-size:20px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--surface2);color:var(--text)}.field textarea{min-height:120px;resize:vertical}.pick{display:flex;gap:7px}.pick button{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--text);font-weight:800}.pick button.sel{color:#fff;background:var(--amber);border-color:var(--amber)}.toast{position:fixed;z-index:90;left:50%;bottom:22px;transform:translate(-50%,18px);padding:12px 18px;border-radius:13px;background:var(--text);color:var(--surface);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.compareDock{position:fixed;z-index:35;right:20px;bottom:20px;display:none;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow)}.compareDock.show{display:flex}.skeleton{background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:shine 1.2s infinite}@keyframes shine{to{background-position:-200% 0}}
    @media(max-width:980px){.navlinks{display:none}.mobileToggle{display:block}.grid{grid-template-columns:repeat(2,1fr)}.detailGrid,.dashboard{grid-template-columns:1fr}.feature{grid-template-columns:1fr}.communityGrid{grid-template-columns:repeat(2,1fr)}.search{max-width:none}.navbtn.mobile{display:block;width:100%;text-align:left}.mobileMenu{position:absolute;top:83px;left:20px;right:20px;padding:10px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow)}}
    @media(max-width:680px){.wrap{width:min(100% - 24px,1200px)}header{padding:6px 0}.search{order:5;flex-basis:100%}nav{flex-wrap:wrap}.account .soft span,.account .primary span{display:none}.hero{padding:58px 0 25px}.hero h1{font-size:49px;letter-spacing:-3px}.lead{font-size:16px}.heroSearch{flex-direction:column}.heroSearch .primary{height:52px}.metrics,.stats{grid-template-columns:repeat(2,1fr)}.grid,.savedGrid,.communityGrid{grid-template-columns:1fr}.section{padding:38px 0}.sectionHead{align-items:flex-start;flex-direction:column}.feature{padding:27px}.profileTop{align-items:flex-start;flex-wrap:wrap}.profileTop .avatar{width:75px;height:75px}.profileActions{width:100%}.toolbar{display:grid;grid-template-columns:1fr}.resultCount{margin:0}.footer{flex-direction:column;gap:8px}.compareDock{left:12px;right:12px;bottom:12px;justify-content:space-between}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
  <header><div class="wrap"><nav>
    <button class="logo" onclick="go('home')">Учитель<b>+</b></button>
    <div class="navlinks" id="navlinks">
      <button class="navbtn" data-page="home" onclick="go('home')">Главная</button>
      <button class="navbtn" data-page="schools" onclick="go('schools')">Школы</button>
      <button class="navbtn" data-page="teachers" onclick="go('teachers')">Учителя</button>
      <button class="navbtn" data-page="community" onclick="go('community')">Ученики</button>
    </div>
    <button class="iconbtn mobileToggle" aria-label="Меню" onclick="toggleMenu()">☰</button>
    <div class="search"><div class="searchbox">⌕ <input id="globalSearch" autocomplete="off" placeholder="Учитель, предмет или школа" oninput="suggest(this.value,'globalSuggest')" onkeydown="if(event.key==='Enter')doSearch(this.value)"></div><div id="globalSuggest" class="suggest"></div></div>
    <button class="iconbtn" aria-label="Сменить тему" onclick="toggleTheme()" id="themeBtn">☾</button>
    <div class="account" id="account"><button class="primary" onclick="openAuth()"><span>Войти</span> ↗</button></div>
  </nav><div id="mobileMenu" class="mobileMenu hidden"><button class="navbtn mobile" onclick="go('home')">Главная</button><button class="navbtn mobile" onclick="go('schools')">Школы</button><button class="navbtn mobile" onclick="go('teachers')">Учителя</button><button class="navbtn mobile" onclick="go('community')">Ученики</button></div></div></header>
  <main id="app"></main>
  <div id="compareDock" class="compareDock"><span id="compareText"></span><button class="primary" onclick="openCompare()">Сравнить</button><button class="iconbtn" onclick="clearCompare()">×</button></div>
  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div>
  <div id="toast" class="toast" role="status"></div>
<script>
const state={db:null,user:null,schools:[],teachers:[],reviews:[],picked:0,scores:{explanation:5,fairness:5,atmosphere:5},filter:{q:'',subject:'all',rating:'0',sort:'rating'},schoolFilter:{q:'',city:'all',sort:'rating'},compare:[],favorites:new Set(JSON.parse(localStorage.getItem('teacherFavorites')||'[]')),loading:true};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name){return String(name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.remove('show'),2600)}
function go(page){const target='#'+page;if(location.hash===target)render();else location.hash=page;scrollTo({top:0,behavior:'smooth'});$('#mobileMenu').classList.add('hidden')}
function toggleMenu(){$('#mobileMenu').classList.toggle('hidden')}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);$('#themeBtn').textContent=next==='dark'?'☀':'☾'}
function openModal(html,wide=false){$('#modalbox').className='modalbox'+(wide?' wide':'');$('#modalbox').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
function schoolOf(t){return state.schools.find(s=>s.id===t.school_id)||{name:'Школа не указана',city:''}}
function teachersAt(id){return state.teachers.filter(t=>t.school_id===id)}
function ratingOfSchool(s){const a=teachersAt(s.id);return a.length?a.reduce((n,t)=>n+Number(t.rating||0),0)/a.length:0}
function formatDate(x){try{return new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',year:'numeric'}).format(new Date(x))}catch{return ''}}
function account(){const e=$('#account');if(!e)return;e.innerHTML=state.user?`<button class="soft" onclick="go('profile')">👤 <span>${esc(state.user.user_metadata?.name||state.user.email.split('@')[0])}</span></button>`:`<button class="primary" onclick="openAuth()"><span>Войти</span> ↗</button>`}
function setActive(page){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}

function teacherCard(t){const s=schoolOf(t),fav=state.favorites.has(t.id),cmp=state.compare.includes(t.id);return `<article class="card"><button class="heart ${fav?'on':''}" aria-label="В избранное" onclick="event.stopPropagation();toggleFavorite('${t.id}')">${fav?'♥':'♡'}</button><div class="teacherTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.subject)}</div><div class="rating">★ ${Number(t.rating||0).toFixed(1)} <span class="muted">· ${Number(t.review_count||0)}</span></div></div></div><div class="meta"><span class="pill">🏫 ${esc(s.name)}</span><span class="pill">${Number(t.recommend_percent||0)}% рекомендуют</span></div><div class="cardActions"><button class="primary" onclick="openTeacher('${t.id}')">Профиль</button><button class="soft" onclick="toggleCompare('${t.id}')">${cmp?'✓ В сравнении':'＋ Сравнить'}</button></div></article>`}
function schoolCard(s){const list=teachersAt(s.id),rating=ratingOfSchool(s),reviews=list.reduce((n,t)=>n+Number(t.review_count||0),0);return `<article class="card schoolCard" onclick="openSchool('${s.id}')"><div class="schoolCover"><div class="schoolIcon">🏫</div></div><h3>${esc(s.name)}</h3><p class="muted">⌖ ${esc(s.city||'Город не указан')}${s.address?' · '+esc(s.address):''}</p><div class="schoolStats"><span><b>${list.length}</b>учителей</span><span><b>${rating?rating.toFixed(1):'—'}</b>рейтинг</span><span><b>${reviews}</b>отзывов</span></div></article>`}
function metric(value,label){return `<div class="metric"><b>${value}</b><span>${label}</span></div>`}
function home(){const totalReviews=state.teachers.reduce((n,t)=>n+Number(t.review_count||0),0),avg=state.teachers.length?state.teachers.reduce((n,t)=>n+Number(t.rating||0),0)/state.teachers.length:0,top=[...state.teachers].sort((a,b)=>Number(b.rating)-Number(a.rating)).slice(0,6);return `<div class="page"><section class="hero"><div class="wrap"><div class="eyebrow">✦ ЧЕСТНЫЙ ВЫБОР УЧЕНИКОВ</div><h1>Находи тех, кто<br><span class="gradient">помогает расти.</span></h1><p class="lead">Исследуй школы, сравнивай преподавателей и делись опытом. Рейтинги, которые помогают ученикам выбирать осознанно.</p><div class="heroSearch"><div class="searchbox">⌕ <input id="heroSearch" autocomplete="off" placeholder="Имя, предмет, школа или город…" oninput="suggest(this.value,'heroSuggest')" onkeydown="if(event.key==='Enter')doSearch(this.value)"></div><button class="primary" onclick="doSearch($('#heroSearch').value)">Найти →</button><div id="heroSuggest" class="suggest"></div></div><div class="quick"><button onclick="quickSearch('Математика')">Математика</button><button onclick="quickSearch('Английский')">Английский</button><button onclick="quickSearch('Физика')">Физика</button><button onclick="go('schools')">Все школы →</button></div></div></section><section class="wrap metrics">${metric(state.schools.length,'школ в каталоге')}${metric(state.teachers.length,'проверенных профилей')}${metric(totalReviews.toLocaleString('ru'),'оценок учеников')}${metric(avg?avg.toFixed(1):'—','средний рейтинг')}</section><section class="wrap section"><div class="sectionHead"><div><div class="eyebrow">ЛУЧШИЕ СЕЙЧАС</div><h2>Учителя, которых рекомендуют</h2><p>Высокий рейтинг и доверие учеников</p></div><button class="soft" onclick="go('teachers')">Смотреть всех →</button></div><div class="grid">${top.map(teacherCard).join('')||empty('Каталог загружается…')}</div></section><section class="wrap section"><div class="feature"><div><div class="eyebrow">КАК ЭТО РАБОТАЕТ</div><h2>Выбор без догадок.</h2><p>Каждый профиль собирает оценки, отзывы и понятную статистику. Сравнивай преподавателей по важным критериям и сохраняй лучших.</p><button class="primary" onclick="go('teachers')">Начать поиск →</button></div><div class="steps"><div class="step"><b>01</b><span>Найди школу или преподавателя</span></div><div class="step"><b>02</b><span>Сравни рейтинг, отзывы и рекомендации</span></div><div class="step"><b>03</b><span>Сохрани профиль и поделись опытом</span></div></div></div></section><footer class="wrap footer"><span>Учитель+ · знания начинаются с доверия</span><span>© 2026</span></footer></div>`}
function empty(text){return `<div class="empty"><div style="font-size:30px">⌕</div><h3>${esc(text)}</h3><p>Попробуй изменить запрос или фильтры.</p></div>`}
function teachersPage(){const subjects=[...new Set(state.teachers.map(t=>t.subject).filter(Boolean))].sort(),f=state.filter,q=f.q.toLowerCase();let list=state.teachers.filter(t=>{const s=schoolOf(t);return(!q||[t.name,t.subject,s.name,s.city].some(x=>String(x||'').toLowerCase().includes(q)))&&(f.subject==='all'||t.subject===f.subject)&&Number(t.rating||0)>=Number(f.rating)});list.sort((a,b)=>f.sort==='reviews'?Number(b.review_count)-Number(a.review_count):f.sort==='name'?a.name.localeCompare(b.name,'ru'):Number(b.rating)-Number(a.rating));return `<div class="page wrap section"><div class="sectionHead"><div><div class="eyebrow">КАТАЛОГ</div><h1>Учителя</h1><p>Фильтруй, сравнивай и сохраняй подходящих преподавателей.</p></div></div><div class="toolbar"><input class="filterInput" value="${esc(f.q)}" placeholder="Поиск по имени, предмету или школе" oninput="state.filter.q=this.value;render()"><select class="filterSelect" onchange="state.filter.subject=this.value;render()"><option value="all">Все предметы</option>${subjects.map(x=>`<option ${f.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filterSelect" onchange="state.filter.rating=this.value;render()"><option value="0">Любой рейтинг</option><option value="4.5" ${f.rating==='4.5'?'selected':''}>От 4.5</option><option value="4.7" ${f.rating==='4.7'?'selected':''}>От 4.7</option><option value="4.9" ${f.rating==='4.9'?'selected':''}>От 4.9</option></select><select class="filterSelect" onchange="state.filter.sort=this.value;render()"><option value="rating">По рейтингу</option><option value="reviews" ${f.sort==='reviews'?'selected':''}>По отзывам</option><option value="name" ${f.sort==='name'?'selected':''}>По имени</option></select><span class="resultCount">Найдено: ${list.length}</span></div><div class="grid">${list.map(teacherCard).join('')||empty('Учителя не найдены')}</div></div>`}
function schoolsPage(){const cities=[...new Set(state.schools.map(s=>s.city).filter(Boolean))].sort(),f=state.schoolFilter,q=f.q.toLowerCase();let list=state.schools.filter(s=>(!q||[s.name,s.city,s.address].some(x=>String(x||'').toLowerCase().includes(q)))&&(f.city==='all'||s.city===f.city));list.sort((a,b)=>f.sort==='name'?a.name.localeCompare(b.name,'ru'):f.sort==='teachers'?teachersAt(b.id).length-teachersAt(a.id).length:ratingOfSchool(b)-ratingOfSchool(a));return `<div class="page wrap section"><div class="sectionHead"><div><div class="eyebrow">ОБРАЗОВАНИЕ РЯДОМ</div><h1>Школы</h1><p>Профили школ, состав преподавателей и общий рейтинг.</p></div></div><div class="toolbar"><input class="filterInput" value="${esc(f.q)}" placeholder="Название, город или адрес" oninput="state.schoolFilter.q=this.value;render()"><select class="filterSelect" onchange="state.schoolFilter.city=this.value;render()"><option value="all">Все города</option>${cities.map(x=>`<option ${f.city===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filterSelect" onchange="state.schoolFilter.sort=this.value;render()"><option value="rating">По рейтингу</option><option value="teachers" ${f.sort==='teachers'?'selected':''}>По числу учителей</option><option value="name" ${f.sort==='name'?'selected':''}>По названию</option></select><span class="resultCount">Школ: ${list.length}</span></div><div class="grid">${list.map(schoolCard).join('')||empty('Школы не найдены')}</div></div>`}
function communityPage(){const leaders=[{name:'Алина',n:28,b:'Эксперт сообщества'},{name:'Максим',n:21,b:'Активный автор'},{name:'София',n:18,b:'Полезные отзывы'},{name:'Даниил',n:15,b:'Исследователь школ'},{name:'Мария',n:12,b:'Новый голос'},{name:'Артём',n:10,b:'Честный критик'}],reviews=state.teachers.reduce((n,t)=>n+Number(t.review_count||0),0);return `<div class="page wrap section"><div class="communityHero"><div class="eyebrow">СООБЩЕСТВО</div><h1>Голос учеников</h1><p>Здесь опыт каждого помогает другим сделать более уверенный выбор.</p><button class="primary" onclick="${state.user?"go('teachers')":"openAuth()"}">${state.user?'Оценить учителя':'Присоединиться'} →</button></div><div class="metrics">${metric(reviews.toLocaleString('ru'),'опубликованных оценок')}${metric(state.teachers.filter(t=>Number(t.recommend_percent)>=95).length,'любимых учителей')}${metric(state.schools.length,'школ обсуждают')}${metric('24/7','доступ к каталогу')}</div><div class="sectionHead"><div><div class="eyebrow">УЧАСТНИКИ</div><h2>Активные ученики</h2><p>Публично показываются только имя и вклад — без личных данных.</p></div></div><div class="communityGrid">${leaders.map((x,i)=>`<div class="card communityCard"><div class="rank">#${i+1}</div><div class="avatar">${initials(x.name)}</div><h3>${x.name}</h3><p class="muted">${x.b}</p><span class="pill">${x.n} полезных отзывов</span></div>`).join('')}</div></div>`}

async function openTeacher(id){const t=state.teachers.find(x=>x.id===id);if(!t)return;const from=(location.hash||'#teachers').slice(1);let reviews=[];if(state.db){const r=await state.db.from('reviews').select('rating,comment,created_at').eq('teacher_id',id).order('created_at',{ascending:false}).limit(50);if(!r.error)reviews=r.data||[]}const counts=[5,4,3,2,1].map(n=>reviews.filter(r=>Number(r.rating)===n).length),max=Math.max(...counts,1),s=schoolOf(t);$('#app').innerHTML=`<div class="page wrap detail"><button class="soft back" onclick="go('${esc(from)}')">← Назад</button><section class="profileHero"><div class="profileTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div class="profileTitle"><h1>${esc(t.name)}</h1><p class="muted">${esc(t.subject)} · <button class="navbtn" onclick="openSchool('${s.id}')">${esc(s.name)}</button></p><div class="rating">★★★★★ <span class="muted">${Number(t.rating||0).toFixed(1)} из 5</span></div></div><div class="profileActions"><button class="soft" onclick="toggleFavorite('${t.id}');openTeacher('${t.id}')">${state.favorites.has(t.id)?'♥ Сохранено':'♡ Сохранить'}</button><button class="primary" onclick="rate('${t.id}')">Оставить отзыв</button></div></div><div class="stats"><div class="stat"><b>${Number(t.rating||0).toFixed(1)}</b><span>рейтинг</span></div><div class="stat"><b>${Number(t.review_count||0)}</b><span>отзывов</span></div><div class="stat"><b>${Number(t.recommend_percent||0)}%</b><span>рекомендуют</span></div><div class="stat"><b>${esc(t.subject||'—')}</b><span>предмет</span></div></div></section><div class="detailGrid"><section class="panel"><h2>О преподавателе</h2><p class="bio">${esc(t.bio||'Описание профиля скоро появится.')}</p><div class="meta"><span class="pill">Понятные объяснения</span><span class="pill">Подготовка к экзаменам</span><span class="pill">Обратная связь</span></div><h2 style="margin-top:30px">Отзывы учеников</h2>${reviews.length?reviews.map(r=>`<article class="review"><div class="reviewHead"><div class="rating">${'★'.repeat(Number(r.rating))}${'☆'.repeat(5-Number(r.rating))}</div><span class="muted">${formatDate(r.created_at)}</span></div><p>${esc(r.comment||'Оценка без комментария')}</p></article>`).join(''):empty('Пока нет текстовых отзывов')}</section><aside><div class="panel"><h3>Распределение оценок</h3><div class="distribution">${[5,4,3,2,1].map((n,i)=>`<div class="barrow"><span>${n}★</span><div class="bar"><i style="width:${counts[i]/max*100}%"></i></div><span>${counts[i]}</span></div>`).join('')}</div></div><div class="panel" style="margin-top:17px"><h3>Школа</h3><p><b>${esc(s.name)}</b></p><p class="muted">⌖ ${esc(s.city)}${s.address?' · '+esc(s.address):''}</p><button class="soft" onclick="openSchool('${s.id}')">Открыть школу →</button></div></aside></div></div>`;setActive('teachers');scrollTo(0,0)}
function openSchool(id){const s=state.schools.find(x=>x.id===id);if(!s)return;const list=teachersAt(id),rating=ratingOfSchool(s),subjects=[...new Set(list.map(t=>t.subject))];$('#app').innerHTML=`<div class="page wrap detail"><button class="soft back" onclick="go('schools')">← Все школы</button><section class="profileHero"><div class="profileTop"><div class="avatar">🏫</div><div class="profileTitle"><div class="eyebrow">ПРОФИЛЬ ШКОЛЫ</div><h1>${esc(s.name)}</h1><p class="muted">⌖ ${esc(s.city||'')}${s.address?' · '+esc(s.address):''}</p></div></div><div class="stats"><div class="stat"><b>${list.length}</b><span>учителей</span></div><div class="stat"><b>${rating?rating.toFixed(1):'—'}</b><span>средний рейтинг</span></div><div class="stat"><b>${subjects.length}</b><span>предметов</span></div><div class="stat"><b>${list.reduce((n,t)=>n+Number(t.review_count||0),0)}</b><span>оценок</span></div></div></section><section class="section"><div class="sectionHead"><div><h2>Команда школы</h2><p>${subjects.map(esc).join(' · ')}</p></div></div><div class="grid">${list.map(teacherCard).join('')||empty('Учителя пока не добавлены')}</div></section></div>`;setActive('schools');scrollTo(0,0)}
function profilePage(){if(!state.user){openAuth();return home()}const fav=state.teachers.filter(t=>state.favorites.has(t.id));return `<div class="page wrap section"><div class="dashboard"><aside class="panel side profileCard"><div class="avatar">${initials(state.user.user_metadata?.name||state.user.email)}</div><h3>${esc(state.user.user_metadata?.name||'Ученик')}</h3><p class="muted">${esc(state.user.email)}</p><button class="navbtn active">♡ Избранное</button><button class="navbtn" onclick="go('teachers')">✦ Найти учителя</button><button class="navbtn" onclick="logout()">↗ Выйти</button></aside><section><div class="sectionHead"><div><div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Мои преподаватели</h1><p>Сохранённые профили доступны на этом устройстве.</p></div></div><div class="savedGrid">${fav.map(teacherCard).join('')||empty('В избранном пока пусто')}</div></section></div></div>`}

function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem('teacherFavorites',JSON.stringify([...state.favorites]));toast(state.favorites.has(id)?'Добавлено в избранное':'Удалено из избранного');render()}
function toggleCompare(id){const i=state.compare.indexOf(id);if(i>=0)state.compare.splice(i,1);else if(state.compare.length<3)state.compare.push(id);else return toast('Можно сравнить до 3 учителей');updateCompare();render()}
function updateCompare(){const dock=$('#compareDock');dock.classList.toggle('show',state.compare.length>0);$('#compareText').textContent=`Выбрано: ${state.compare.length}/3`}
function clearCompare(){state.compare=[];updateCompare();render()}
function openCompare(){const list=state.compare.map(id=>state.teachers.find(t=>t.id===id)).filter(Boolean);openModal(`<div class="modalhead"><h2>Сравнение учителей</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid" style="margin-top:20px">${list.map(t=>`<div class="card"><div class="avatar">${esc(t.initials||initials(t.name))}</div><h3>${esc(t.name)}</h3><p class="muted">${esc(t.subject)}</p><div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>${Number(t.rating).toFixed(1)}</b><span>рейтинг</span></div><div class="stat"><b>${Number(t.review_count||0)}</b><span>отзывов</span></div><div class="stat"><b>${Number(t.recommend_percent||0)}%</b><span>рекомендуют</span></div></div><button class="primary" onclick="closeModal();openTeacher('${t.id}')">Открыть</button></div>`).join('')}</div>`,true)}
function quickSearch(q){state.filter.q=q;go('teachers')}
function doSearch(q){q=q.trim();if(!q)return;state.filter.q=q;hideSuggest();go('teachers')}
function suggest(q,target){const e=document.getElementById(target);if(!e)return;q=q.trim().toLowerCase();if(!q){e.classList.remove('show');return}const ts=state.teachers.filter(t=>[t.name,t.subject,schoolOf(t).name].some(x=>String(x).toLowerCase().includes(q))).slice(0,4),ss=state.schools.filter(s=>[s.name,s.city,s.address].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,3);e.innerHTML=[...ts.map(t=>`<button onclick="hideSuggest();openTeacher('${t.id}')"><b>👤 ${esc(t.name)}</b><br><span class="muted">${esc(t.subject)} · ${esc(schoolOf(t).name)}</span></button>`),...ss.map(s=>`<button onclick="hideSuggest();openSchool('${s.id}')"><b>🏫 ${esc(s.name)}</b><br><span class="muted">${esc(s.city)}</span></button>`)].join('')||'<button class="muted">Ничего не найдено</button>';e.classList.add('show')}
function hideSuggest(){$$('.suggest').forEach(e=>e.classList.remove('show'))}

let registerMode=false;
function openAuth(){registerMode=false;openModal(`<div class="modalhead"><h2 id="authTitle">Войти</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Сохраняй учителей и публикуй отзывы от своего имени.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div><div id="nameFields" class="hidden"><div class="field"><label>Имя</label><input id="first"></div><div class="field"><label>Фамилия</label><input id="last"></div></div><button class="primary" style="width:100%" onclick="submitAuth()">Продолжить</button><p class="muted" id="authMsg"></p><button class="navbtn" id="switchAuth" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</button>`)}
function toggleAuth(){registerMode=!registerMode;$('#authTitle').textContent=registerMode?'Создать аккаунт':'Войти';$('#nameFields').classList.toggle('hidden',!registerMode);$('#switchAuth').textContent=registerMode?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}
async function submitAuth(){if(!state.db)return toast('Подключение к базе недоступно');const email=$('#email').value.trim(),password=$('#password').value,msg=$('#authMsg');if(!email||password.length<6){msg.textContent='Проверь email и введи пароль минимум из 6 символов.';return}if(registerMode){const first=$('#first').value.trim(),last=$('#last').value.trim();if(!first||!last){msg.textContent='Укажи имя и фамилию.';return}const r=await state.db.auth.signUp({email,password,options:{data:{name:`${first} ${last}`,first_name:first,last_name:last}}});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;account();msg.textContent='Готово! Если подтверждение почты включено, проверь входящие.';setTimeout(closeModal,900)}else{const r=await state.db.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;account();closeModal();toast('Добро пожаловать!')}}
async function logout(){if(state.db)await state.db.auth.signOut();state.user=null;account();go('home')}
function rate(id){if(!state.db)return toast('Подключение к базе недоступно');if(!state.user){openAuth();return toast('Сначала войди в аккаунт')}const t=state.teachers.find(x=>x.id===id);state.picked=0;state.scores={explanation:5,fairness:5,atmosphere:5};openModal(`<div class="modalhead"><h2>Оценить ${esc(t.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Один аккаунт может оставить одну оценку преподавателю.</p><div class="field"><label>Общая оценка</label><div class="pick">${[1,2,3,4,5].map(n=>`<button onclick="pick(${n})">${n} ★</button>`).join('')}</div></div><div class="field"><label>Понятность объяснений</label><select onchange="state.scores.explanation=Number(this.value)">${scoreOptions()}</select></div><div class="field"><label>Справедливость оценивания</label><select onchange="state.scores.fairness=Number(this.value)">${scoreOptions()}</select></div><div class="field"><label>Атмосфера на уроках</label><select onchange="state.scores.atmosphere=Number(this.value)">${scoreOptions()}</select></div><div class="field"><label>Что было особенно полезно?</label><textarea id="comment" maxlength="1000" placeholder="Расскажи о подаче материала, атмосфере и обратной связи…"></textarea></div><button class="primary" style="width:100%" onclick="sendReview('${id}')">Опубликовать отзыв</button><p id="rateMsg" class="muted"></p>`)}
function scoreOptions(){return [5,4,3,2,1].map(n=>`<option value="${n}">${n} — ${['','нужно улучшить','ниже ожиданий','хорошо','очень хорошо','отлично'][n]}</option>`).join('')}
function pick(n){state.picked=n;$$('.pick button').forEach((b,i)=>b.classList.toggle('sel',i<n))}
async function sendReview(id){if(!state.picked)return toast('Выбери общую оценку');const r=await state.db.from('reviews').insert({teacher_id:id,user_id:state.user.id,rating:state.picked,explanation:state.scores.explanation,fairness:state.scores.fairness,atmosphere:state.scores.atmosphere,comment:$('#comment').value.trim()});if(r.error){$('#rateMsg').textContent=r.error.code==='23505'?'Ты уже оценивал этого преподавателя.':r.error.message;return}closeModal();toast('Спасибо! Оценка опубликована');await loadData();openTeacher(id)}

function loading(){return `<div class="wrap section"><div class="metrics">${[1,2,3,4].map(()=>'<div class="metric skeleton" style="height:95px"></div>').join('')}</div><div class="grid">${[1,2,3,4,5,6].map(()=>'<div class="card skeleton" style="height:210px"></div>').join('')}</div></div>`}
function render(){if(state.loading){$('#app').innerHTML=loading();return}const page=(location.hash||'#home').slice(1).split('?')[0]||'home';setActive(page);if(page==='schools')$('#app').innerHTML=schoolsPage();else if(page==='teachers')$('#app').innerHTML=teachersPage();else if(page==='community')$('#app').innerHTML=communityPage();else if(page==='profile')$('#app').innerHTML=profilePage();else $('#app').innerHTML=home();updateCompare()}
async function loadData(){state.loading=true;render();try{const cfg=window.RUNTIME_CONFIG||{};if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Supabase не настроен');state.db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{db:{schema:'public'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const [session,sr,tr]=await Promise.all([state.db.auth.getSession(),state.db.from('schools').select('*').order('name'),state.db.from('teachers').select('*').order('rating',{ascending:false})]);state.user=session.data.session?.user||null;if(sr.error)throw sr.error;if(tr.error)throw tr.error;state.schools=sr.data||[];state.teachers=tr.data||[];state.db.auth.onAuthStateChange((_,s)=>{state.user=s?.user||null;account()})}catch(e){console.error(e);toast('Не удалось загрузить каталог. Попробуй обновить страницу.')}finally{state.loading=false;account();render()}}
document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';$('#themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';
window.addEventListener('hashchange',render);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideSuggest()}});document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('.heroSearch'))hideSuggest()});loadData();
</script>
</body>
</html>
