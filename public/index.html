const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name){return String(name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.remove('show'),2600)}
function currentRouteName(){return(location.hash||'#home').slice(1).split('?')[0]||'home'}
function go(page){const target='#'+page,from=currentRouteName();if(location.hash!==target)history.pushState({page,from},'',target);const draw=()=>{render();scrollTo({top:0,behavior:'smooth'});$('#mobileMenu').classList.add('hidden')};if(document.startViewTransition)document.startViewTransition(draw);else draw()}
function backToPrevious(fallback='home'){if(history.state?.from){history.back();return}go(fallback)}
function wireContextualBack(fallback='home'){const button=$('.back');if(!button)return;button.classList.add('routeBack');button.onclick=()=>backToPrevious(fallback)}
function toggleMenu(){$('#mobileMenu').classList.toggle('hidden')}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);$('#themeBtn').textContent=next==='dark'?'☀':'☾'}
function openModal(html,wide=false){$('#modalbox').className='modalbox'+(wide?' wide':'');$('#modalbox').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
function schoolOf(t){return state.schools.find(s=>s.id===t.school_id)||{name:'Школа не указана',city:'',region:''}}
function teachersAt(id){return state.teachers.filter(t=>t.school_id===id)}
function ratingOfSchool(s){const a=teachersAt(s.id);return a.length?a.reduce((n,t)=>n+Number(t.rating||0),0)/a.length:0}
function formatDate(x){try{return new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',year:'numeric'}).format(new Date(x))}catch{return ''}}
function account(){const e=$('#account');if(!e)return;e.innerHTML=state.user?`<button class="iconbtn" title="Добавить учителя" onclick="openTeacherRequest()">＋</button><button class="soft" onclick="go('profile')">👤 <span>${esc(state.user.user_metadata?.name||state.user.email?.split('@')[0]||'Ученик')}</span></button>`:`<button class="primary" onclick="openAuth()"><span>Войти</span> ↗</button>`}
function setActive(page){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function preferredRegion(){return localStorage.getItem('preferredRegion')||state.user?.user_metadata?.preferred_region||''}
function regionSelectOptions(selected=''){return `<option value="">Выбрать регион</option>${RU_REGIONS.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('')}`}
async function savePreferredRegion(region,notify=true){if(!region)return;localStorage.setItem('preferredRegion',region);state.schoolFilter.region=region;state.filter.region=region;state.chatRegion=region;if(state.user&&!state.user.is_anonymous&&state.db){const r=await state.db.auth.updateUser({data:{preferred_region:region}});if(!r.error)state.user=r.data.user}if(notify)toast(`Регион сохранён: ${region}`)}
function openRegionOnboarding(){openModal(`<div class="modalhead"><h2>Ваш регион</h2><button class="close" onclick="skipRegionOnboarding()">×</button></div><p class="muted">Выберем школы, учителей, полезные материалы и региональный чат рядом с вами.</p><div class="field"><label>Регион России</label><select id="onboardingRegion">${regionSelectOptions(preferredRegion())}</select></div><button class="primary" style="width:100%" onclick="completeRegionOnboarding()">Сохранить регион</button><button class="navbtn" style="width:100%;margin-top:8px" onclick="skipRegionOnboarding()">Выбрать позже</button>`)}
async function completeRegionOnboarding(){const region=$('#onboardingRegion').value;if(!region)return toast('Выбери регион');await savePreferredRegion(region);localStorage.setItem('regionPromptSeen','1');closeModal();render()}
function skipRegionOnboarding(){localStorage.setItem('regionPromptSeen','1');closeModal()}

function teacherCard(t){const s=schoolOf(t),fav=state.favorites.has(t.id),cmp=state.compare.includes(t.id),community=t.source_type==='community';return `<article class="card"><button class="heart ${fav?'on':''}" aria-label="В избранное" onclick="event.stopPropagation();toggleFavorite('${t.id}')">${fav?'♥':'♡'}</button><div class="teacherTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.subject)}</div><div class="rating">★ ${Number(t.rating||0).toFixed(1)} <span class="muted">· ${Number(t.review_count||0)}</span></div></div></div><div class="meta"><span class="pill">🏫 ${esc(s.name)}</span>${s.region?`<span class="pill">⌖ ${esc(s.region)}</span>`:''}<span class="sourceBadge ${community?'community':''}">${community?'◎ Добавлен сообществом':'✓ Проверенный профиль'}</span></div><div class="cardActions"><button class="primary" onclick="openTeacher('${t.id}')">Профиль</button><button class="soft" onclick="toggleCompare('${t.id}')">${cmp?'✓ В сравнении':'＋ Сравнить'}</button></div></article>`}
function schoolCard(s){const list=teachersAt(s.id),rating=ratingOfSchool(s),reviews=list.reduce((n,t)=>n+Number(t.review_count||0),0),community=s.source_type==='community';return `<article class="card schoolCard" onclick="openSchool('${s.id}')"><div class="schoolCover"><div class="schoolIcon">🏫</div></div><span class="sourceBadge ${community?'community':''}">${community?'◎ Сообщество':'✓ Источник проверен'}</span><h3>${esc(s.name)}</h3><p class="muted">⌖ ${esc([s.region,s.city].filter(Boolean).join(', ')||'Местоположение не указано')}${s.address?' · '+esc(s.address):''}</p><div class="schoolStats"><span><b>${list.length}</b>учителей</span><span><b>${rating?rating.toFixed(1):'—'}</b>рейтинг</span><span><b>${reviews}</b>отзывов</span></div></article>`}
function metric(value,label){return `<div class="metric"><b>${value}</b><span>${label}</span></div>`}
function mobileProfile(){state.user?go('profile'):openAuth()}
function guideCard(a){return `<article class="card guideCard" onclick="go('guide/${a.slug}')"><div class="guideIcon">${a.icon}</div><span class="eyebrow">${esc(a.tag)}</span><h3>${esc(a.title)}</h3><p class="muted">${esc(a.lead)}</p><button class="soft">Читать →</button></article>`}

v class="step"><b>01</b><span>Выбери регион, школу или преподавателя</span></div><div class="step"><b>02</b><span>Сравни рейтинг, отзывы и рекомендации</span></div><div class="step"><b>03</b><span>Добавь отсутствующий профиль вместе с сообществом</span></div></div></div></section><footer class="wrap footer"><span>Учитель+ · знания начинаются с доверия</span><span>© 2026</span></footer></div>`}

ss="filterSelect" onchange="state.filter.sort=this.value;render()"><option value="rating">По рейтингу</option><option value="reviews" ${f.sort==='reviews'?'selected':''}>По отзывам</option><option value="name" ${f.sort==='name'?'selected':''}>По имени</option></select><span class="resultCount">Найдено: ${list.length}</span></div><div class="grid">${list.map(teacherCard).join('')||empty('Учителя не найдены')}</div></div>`}

function schoolsPage(){const f=state.schoolFilter,q=f.q.toLowerCase(),regions=[...new Set([...RU_REGIONS,...state.schools.map(s=>s.region).filter(Boolean)])].sort(),cities=[...new Set(state.schools.filter(s=>f.region==='all'||s.region===f.region).map(s=>s.city).filter(Boolean))].sort();let list=state.schools.filter(s=>(!q||[s.name,s.city,s.region,s.address].some(x=>String(x||'').toLowerCase().includes(q)))&&(f.region==='all'||s.region===f.region)&&(f.city==='all'||s.city===f.city));list.sort((a,b)=>f.sort==='name'?a.name.localeCompare(b.name,'ru'):f.sort==='teachers'?teachersAt(b.id).length-teachersAt(a.id).length:ratingOfSchool(b)-ratingOfSchool(a));return `<div class="page wrap section"><div class="sectionHead"><div><div class="eyebrow">ОБРАЗОВАНИЕ РЯДОМ</div><h1>${f.region==='all'?'Школы России':esc(f.region)}</h1><p>Профили школ, состав преподавателей и общий рейтинг.</p></div><div class="profileActions"><button class="soft" onclick="go('regions')">Карта регионов</button><button class="primary" onclick="openTeacherRequest()">＋ Добавить учителя</button></div></div><div class="toolbar"><input id="schoolFilterInput" class="filterInput" value="${esc(f.q)}" placeholder="Название, город или адрес" oninput="updateQuery('school',this)"><select class="filterSelect" onchange="state.schoolFilter.region=this.value;state.schoolFilter.city='all';render()"><option value="all">Все регионы</option>${regions.map(x=>`<option ${f.region===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filterSelect" onchange="state.schoolFilter.city=this.value;render()"><option value="all">Все города</option>${cities.map(x=>`<option ${f.city===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filterSelect" onchange="state.schoolFilter.sort=this.value;render()"><option value="rating">По рейтингу</option><option value="teachers" ${f.sort==='teachers'?'selected':''}>По числу учителей</option><option value="name" ${f.sort==='name'?'selected':''}>По названию</option></select><span class="resultCount">Школ: ${list.length}</span></div><div class="grid">${list.map(schoolCard).join('')||empty('В этом регионе школы ещё не добавлены')}</div></div>`}
function communityPage(){const grouped={};state.reviews.forEach(r=>{const key=r.user_id||'anonymous';if(!grouped[key])grouped[key]={id:key,n:0,sum:0,helpful:0};grouped[key].n++;grouped[key].sum+=Number(r.rating||0);grouped[key].helpful+=state.votes.filter(v=>v.review_id===r.id&&v.is_helpful).length});const leaders=Object.values(grouped).sort((a,b)=>(b.n+b.helpful)-(a.n+a.helpful)).slice(0,9),reviews=state.reviews.length||state.teachers.reduce((n,t)=>n+Number(t.review_count||0),0),helpful=state.votes.filter(v=>v.is_helpful).length;return `<div class="page wrap section"><div class="communityHero"><div class="eyebrow">СООБЩЕСТВО</div><h1>Голос учеников</h1><p>Реальный опыт помогает другим сделать уверенный выбор. Личные данные скрыты — виден только вклад.</p><button class="primary" onclick="${state.user?"go('teachers')":"openAuth()"}">${state.user?'Оценить учителя':'Присоединиться'} →</button></div><div class="metrics">${metric(reviews.toLocaleString('ru'),'опубликованных оценок')}${metric(helpful.toLocaleString('ru'),'отметок «полезно»')}${metric(leaders.length,'активных авторов')}${metric(state.schools.length,'школ обсуждают')}</div><div class="sectionHead"><div><div class="eyebrow">РЕАЛЬНАЯ АКТИВНОСТЬ</div><h2>Авторы полезных отзывов</h2><p>Анонимный рейтинг строится по числу отзывов и отметок сообщества.</p></div></div><div class="communityGrid">${leaders.length?leaders.map((x,i)=>{const level=x.n>=5?'Эксперт сообщества':x.n>=3?'Активный автор':'Новый голос';return `<div class="card communityCard"><div class="rank">#${i+1}</div><div class="avatar">У${String(i+1).padStart(2,'0')}</div><h3>Ученик ${String(i+1).padStart(2,'0')}</h3><p class="muted">${level}</p><div class="badgeLine"></div><span class="pill">${x.n} ${plural(x.n,'отзыв','отзыва','отзывов')}</span> <span class="pill">★ ${(x.sum/x.n).toFixed(1)}</span>${x.helpful?`<span class="pill">👍 ${x.helpful}</span>`:''}</div>`}).join(''):empty('Активность появится после первых отзывов')}</div></div>`}
function plural(n,one,few,many){const m=Math.abs(n)%100,d=m%10;return m>10&&m<20?many:d>1&&d<5?few:d===1?one:many}

async function openTeacher(id){const t=state.teachers.find(x=>x.id===id);if(!t)return;const current=(location.hash||'#teachers').slice(1),from=current.startsWith('teacher/')?(history.state?.from||'teachers'):current;if(current!==`teacher/${id}`)history.pushState({from},'',`#teacher/${id}`);state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,6);localStorage.setItem('teacherRecent',JSON.stringify(state.recent));let reviews=[],votes=[];if(state.db){const r=await state.db.from('reviews').select('id,user_id,rating,explanation,fairness,atmosphere,comment,created_at').eq('teacher_id',id).order('created_at',{ascending:false}).limit(50);if(!r.error)reviews=r.data||[];if(reviews.length){const vr=await state.db.from('review_votes').select('review_id,user_id,is_helpful').in('review_id',reviews.map(x=>x.id));if(!vr.error){votes=vr.data||[];state.votes=[...state.votes.filter(v=>!reviews.some(r=>r.id===v.review_id)),...votes]}}}const counts=[5,4,3,2,1].map(n=>reviews.filter(r=>Number(r.rating)===n).length),max=Math.max(...counts,1),s=schoolOf(t);$('#app').innerHTML=`<div class="page wrap detail"><button class="soft back" onclick="go('${esc(from)}')">← Назад</button><section class="profileHero"><div class="profileTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div class="profileTitle"><h1>${esc(t.name)}</h1><p class="muted">${esc(t.subject)} · <button class="navbtn" onclick="openSchool('${s.id}')">${esc(s.name)}</button></p><div class="rating">★★★★★ <span class="muted">${Number(t.rating||0).toFixed(1)} из 5</span></div></div><div class="profileActions"><button class="soft" onclick="toggleFavorite('${t.id}');openTeacher('${t.id}')">${state.favorites.has(t.id)?'♥ Сохранено':'♡ Сохранить'}</button><button class="soft" onclick="shareTeacher('${t.id}')">↗ Поделиться</button><button class="primary" onclick="rate('${t.id}')">Оставить отзыв</button></div></div><div class="stats"><div class="stat"><b>${Number(t.rating||0).toFixed(1)}</b><span>рейтинг</span></div><div class="stat"><b>${Number(t.review_count||0)}</b><span>отзывов</span></div><div class="stat"><b>${Number(t.recommend_percent||0)}%</b><span>рекомендуют</span></div><div class="stat"><b>${esc(t.subject||'—')}</b><span>предмет</span></div></div></section><div class="detailGrid"><section class="panel"><h2>О преподавателе</h2><p class="bio">${esc(t.bio||'Описание профиля скоро появится.')}</p><div class="meta"><span class="pill">Понятные объяснения</span><span class="pill">Подготовка к экзаменам</span><span class="pill">Обратная связь</span></div><h2 style="margin-top:30px">Отзывы учеников</h2>${reviews.length?reviews.map(r=>reviewCard(r,id,votes)).join(''):empty('Пока нет текстовых отзывов')}</section><aside><div class="panel"><h3>Распределение оценок</h3><div class="distribution">${[5,4,3,2,1].map((n,i)=>`<div class="barrow"><span>${n}★</span><div class="bar"><i style="width:${counts[i]/max*100}%"></i></div><span>${counts[i]}</span></div>`).join('')}</div></div><div class="panel" style="margin-top:17px"><h3>Школа</h3><p><b>${esc(s.name)}</b></p><p class="muted">⌖ ${esc(s.city)}${s.address?' · '+esc(s.address):''}</p><button class="soft" onclick="openSchool('${s.id}')">Открыть школу →</button></div></aside></div></div>`;setActive('teachers');scrollTo(0,0)}
function reviewCard(r,teacherId,votes){const up=votes.filter(v=>v.review_id===r.id&&v.is_helpful).length,down=votes.filter(v=>v.review_id===r.id&&!v.is_helpful).length,mine=votes.find(v=>v.review_id===r.id&&v.user_id===state.user?.id),local=state.localVotes[r.id];return `<article class="review"><div class="reviewHead"><div class="rating">${'★'.repeat(Number(r.rating))}${'☆'.repeat(5-Number(r.rating))}</div><span class="muted">${formatDate(r.created_at)}</span></div>${r.explanation?`<div class="criteria"><span>Объяснение ${r.explanation}/5</span><span>Справедливость ${r.fairness}/5</span><span>Атмосфера ${r.atmosphere}/5</span></div>`:''}<p>${esc(r.comment||'Оценка без комментария')}</p><div class="reviewFooter"><span class="muted">Был ли отзыв полезен?</span><div class="helpful"><button class="${mine?.is_helpful===true||local===true?'on':''}" onclick="voteReview('${r.id}',true,'${teacherId}')">👍 Полезно ${up||''}</button><button class="${mine?.is_helpful===false||local===false?'on':''}" onclick="voteReview('${r.id}',false,'${teacherId}')">👎 Не очень ${down||''}</button></div></div></article>`}

function openMatch(){const subjects=[...new Set(state.teachers.map(t=>t.subject).filter(Boolean))].sort(),regions=[...new Set(state.schools.map(s=>s.region).filter(Boolean))].sort(),preferred=state.schoolFilter.region;openModal(`<div class="modalhead"><h2>✦ Умный подбор</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Три ответа — и сразу наиболее подходящий результат.</p><div class="field"><label>Регион</label><select id="matchRegion"><option value="all">Вся Россия</option>${regions.map(x=>`<option ${preferred===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Какой предмет нужен?</label><select id="matchSubject"><option value="all">Любой предмет</option>${subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Что важнее?</label><select id="matchGoal"><option value="rating">Максимальный рейтинг</option><option value="reviews">Много проверенных отзывов</option><option value="recommend">Рекомендации учеников</option></select></div><button class="primary" style="width:100%" onclick="runMatch()">Найти совпадение →</button>`)}

function openTeacherRequest(schoolId=''){if(!state.user){state.pendingRequestSchool=schoolId||'__new__';openAuth();return toast('Войди, чтобы подтвердить данные об учителе')}const school=state.schools.find(s=>s.id===schoolId),region=school?.region||state.schoolFilter.region!=='all'&&state.schoolFilter.region||'';openModal(`<div class="modalhead"><h2>Добавить учителя</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Профиль публикуется после 5 независимых совпадающих заявок. Так мы покрываем небольшие города и защищаем каталог от ошибок.</p><div class="ratingNotice">✓ Не указывай личные контакты, адрес проживания или другую частную информацию.</div><input id="requestSchoolId" type="hidden" value="${esc(schoolId)}"><div class="field"><label>Регион России</label><select id="requestRegion"><option value="">Выбери регион</option>${regionOptions(region)}</select></div><div class="field"><label>Город или населённый пункт</label><input id="requestCity" value="${esc(school?.city||'')}" placeholder="Например, Тула"></div><div class="field"><label>Школа</label><input id="requestSchool" value="${esc(school?.name||'')}" placeholder="Полное или привычное название"></div><div class="field"><label>Имя и фамилия учителя</label><input id="requestTeacher" placeholder="Как указано на сайте школы"></div><div class="field"><label>Предмет</label><input id="requestSubject" placeholder="Например, математика"></div><div class="field"><label>Ссылка на страницу школы <span class="muted">(необязательно)</span></label><input id="requestSource" type="url" placeholder="https://school.ru/sveden/employees/"></div><div class="field"><label>Краткое описание <span class="muted">(необязательно)</span></label><textarea id="requestBio" maxlength="500" placeholder="Что преподаёт и чем особенно помогает ученикам"></textarea></div><div class="field"><label>Твоя первая оценка</label><select id="requestRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select></div><button class="primary" style="width:100%" onclick="sendTeacherRequest()">Отправить подтверждение</button><p id="requestMsg" class="muted"></p>`)}
async function sendTeacherRequest(){const data={user_id:state.user.id,school_id:$('#requestSchoolId').value||null,region:$('#requestRegion').value.trim(),city:$('#requestCity').value.trim(),school_name:$('#requestSchool').value.trim(),teacher_name:$('#requestTeacher').value.trim(),subject:$('#requestSubject').value.trim(),source_url:$('#requestSource').value.trim()||null,teacher_bio:$('#requestBio').value.trim()||null,rating:Number($('#requestRating').value)};const msg=$('#requestMsg');if(!data.region||!data.city||!data.school_name||!data.teacher_name||!data.subject){msg.textContent='Заполни регион, населённый пункт, школу, имя учителя и предмет.';return}const r=await state.db.from('teacher_requests').insert(data).select('candidate_key,status').single();if(r.error){msg.textContent=r.error.code==='23505'?'Ты уже подтверждал этого учителя. Осталось дождаться других учеников.':'Функция требует обновления базы: '+r.error.message;return}const count=await state.db.from('teacher_requests').select('id',{count:'exact',head:true}).eq('candidate_key',r.data.candidate_key);closeModal();toast((count.count||1)>=5?'Профиль создан и появился в поиске!':'Заявка принята: '+(count.count||1)+'/5 подтверждений');await loadData()}

let registerMode=false;

async function submitAuth(){if(!state.db)return toast('Подключение к базе недоступно');const email=$('#email').value.trim(),password=$('#password').value,msg=$('#authMsg');if(!email||password.length<6){msg.textContent='Проверь email и введи пароль минимум из 6 символов.';return}if(registerMode){const first=$('#first').value.trim(),last=$('#last').value.trim();if(!first||!last){msg.textContent='Укажи имя и фамилию.';return}const r=await state.db.auth.signUp({email,password,options:{data:{name:`${first} ${last}`,first_name:first,last_name:last}}});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;account();if(r.data.session){closeModal();toast('Аккаунт создан');await resumePending()}else msg.textContent='Готово! Подтверди почту, затем войди — действие будет доступно.'}else{const r=await state.db.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;account();closeModal();toast('Добро пожаловать!');await resumePending()}}
async function continueAsGuest(){const id=state.pendingRate;if(!id)return;const r=await state.db.auth.signInAnonymously({options:{data:{name:'Гость'}}});if(r.error){const msg=$('#authMsg');if(msg)msg.textContent='Гостевой вход пока отключён. Войди по email или зарегистрируйся.';return}state.user=r.data.user;account();closeModal();state.pendingRate=null;await rate(id)}
async function logout(){if(state.db)await state.db.auth.signOut();state.user=null;account();go('home')}
async function rate(id){if(!state.db)return toast('Подключение к базе недоступно');if(!state.user){state.pendingRate=id;openAuth();return toast('Войди или продолжи как гость')}const t=state.teachers.find(x=>x.id===id);if(!t)return;const existing=await state.db.from('reviews').select('rating,explanation,fairness,atmosphere,comment').eq('teacher_id',id).eq('user_id',state.user.id).maybeSingle();const old=existing.data;state.picked=Number(old?.rating||0);state.scores={explanation:Number(old?.explanation||5),fairness:Number(old?.fairness||5),atmosphere:Number(old?.atmosphere||5)};openModal(`<div class="modalhead"><h2>${old?'Изменить оценку':'Оценить'} ${esc(t.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="ratingNotice">Одна актуальная оценка на аккаунт. Её можно изменить в любой момент.</div><div class="field"><label>Общая оценка</label><div class="pick">${[1,2,3,4,5].map(n=>`<button class="${n<=state.picked?'sel':''}" onclick="pick(${n})">${n} ★</button>`).join('')}</div></div><div class="field"><label>Понятность объяснений</label><select onchange="state.scores.explanation=Number(this.value)">${scoreOptions(state.scores.explanation)}</select></div><div class="field"><label>Справедливость оценивания</label><select onchange="state.scores.fairness=Number(this.value)">${scoreOptions(state.scores.fairness)}</select></div><div class="field"><label>Атмосфера на уроках</label><select onchange="state.scores.atmosphere=Number(this.value)">${scoreOptions(state.scores.atmosphere)}</select></div><div class="field"><label>Что было особенно полезно?</label><textarea id="comment" maxlength="1000" placeholder="Расскажи о подаче материала, атмосфере и обратной связи…">${esc(old?.comment||'')}</textarea></div><button class="primary" style="width:100%" onclick="sendReview('${id}')">${old?'Сохранить изменения':'Опубликовать отзыв'}</button><p id="rateMsg" class="muted"></p>`)}
function scoreOptions(selected=5){return [5,4,3,2,1].map(n=>`<option value="${n}" ${n===selected?'selected':''}>${n} — ${['','нужно улучшить','ниже ожиданий','хорошо','очень хорошо','отлично'][n]}</option>`).join('')}
function pick(n){state.picked=n;$$('.pick button').forEach((b,i)=>b.classList.toggle('sel',i<n))}
async function sendReview(id){if(!state.picked)return toast('Выбери общую оценку');const r=await state.db.from('reviews').upsert({teacher_id:id,user_id:state.user.id,rating:state.picked,explanation:state.scores.explanation,fairness:state.scores.fairness,atmosphere:state.scores.atmosphere,comment:$('#comment').value.trim()},{onConflict:'teacher_id,user_id'});if(r.error){$('#rateMsg').textContent=r.error.message;return}closeModal();toast('Оценка сохранена');await loadData();openTeacher(id)}

function verificationBadge(t){const status=t.verification_status||((t.source_type&&t.source_type!=='community')?'verified':'community');if(status==='verified')return '<span class="verifyBadge verified">✓ Подтверждён автоматически</span>';if(status==='rejected')return '<span class="verifyBadge">× Не подтверждён</span>';if(status==='needs_review')return '<span class="verifyBadge">◌ Проверяется модератором</span>';return '<span class="verifyBadge">↻ Проверяется</span>'}
teacherCard=function(t){const s=schoolOf(t),fav=state.favorites.has(t.id),cmp=state.compare.includes(t.id);return `<article class="card"><button class="heart ${fav?'on':''}" aria-label="В избранное" onclick="event.stopPropagation();toggleFavorite('${t.id}')">${fav?'♥':'♡'}</button><div class="teacherTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.subject)}</div><div class="rating">★ ${Number(t.rating||0).toFixed(1)} <span class="muted">· ${Number(t.review_count||0)}</span></div></div></div><div class="meta"><span class="pill">🏫 ${esc(s.name)}</span>${s.region?`<span class="pill">⌖ ${esc(s.region)}</span>`:''}${verificationBadge(t)}</div><div class="cardActions"><button class="primary" onclick="openTeacher('${t.id}')">Профиль</button><button class="soft" onclick="toggleCompare('${t.id}')">${cmp?'✓ В сравнении':'＋ Сравнить'}</button></div></article>`}
function decimalOptions(selected=5){const labels={1:'нужно улучшить',2:'ниже ожиданий',3:'хорошо',4:'очень хорошо',5:'отлично'};return Array.from({length:41},(_,i)=>Number((5-i*.1).toFixed(1))).map(n=>`<option value="${n}" ${Number(selected)===n?'selected':''}>${n.toFixed(1)} — ${labels[Math.round(n)]}</option>`).join('')}
function criterion(label,key){return `<div class="field"><label>${label}</label><select onchange="state.scores.${key}=Number(this.value)">${decimalOptions(state.scores[key])}</select></div>`}
function pickDecimal(n){state.picked=Number(n);const out=$('#scoreValue');if(out)out.textContent=state.picked.toFixed(1);$$('.pick button').forEach(b=>b.classList.toggle('sel',Number(b.dataset.score)===state.picked))}
rate=async function(id){if(!state.db)return toast('Подключение к базе недоступно');if(!state.user){state.pendingRate=id;openAuth();return toast('Войди или продолжи как гость')}const t=state.teachers.find(x=>x.id===id);if(!t)return;const existing=await state.db.from('reviews').select('*').eq('teacher_id',id).eq('user_id',state.user.id).maybeSingle();const old=existing.data,defaults={explanation:5,fairness:5,atmosphere:5,engagement:5,respect:5,feedback:5,workload:5,exam_prep:5};state.picked=Number(old?.rating||4.5);state.scores=Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,Number(old?.[k]??v)]));openModal(`<div class="modalhead"><h2>${old?'Изменить оценку':'Оценить'} ${esc(t.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="ratingNotice">Можно поставить оценку с шагом 0,1. Один аккаунт — одна актуальная оценка, которую разрешено изменить.</div><div class="field"><label>Общая оценка</label><div class="rangeScore"><div class="scoreValue" id="scoreValue">${state.picked.toFixed(1)}</div><input type="range" min="1" max="5" step="0.1" value="${state.picked}" oninput="pickDecimal(this.value)" aria-label="Общая оценка"></div><div class="pick" style="margin-top:9px">${[1,2,3,4,5].map(n=>`<button data-score="${n}" class="${n===state.picked?'sel':''}" onclick="pickDecimal(${n})">${n} ★</button>`).join('')}</div></div><div class="criteriaGrid">${criterion('Понятность объяснений','explanation')}${criterion('Справедливость','fairness')}${criterion('Атмосфера','atmosphere')}${criterion('Вовлечённость','engagement')}${criterion('Уважение к ученикам','respect')}${criterion('Качество обратной связи','feedback')}${criterion('Разумность нагрузки','workload')}${criterion('Подготовка к экзаменам','exam_prep')}</div><div class="field"><label>Комментарий</label><textarea id="comment" maxlength="1200" placeholder="Опиши конкретный учебный опыт без личных данных…">${esc(old?.comment||'')}</textarea></div><button class="primary stickyRate" style="width:100%" onclick="sendReview('${id}')">${old?'Сохранить изменения':'Опубликовать отзыв'}</button><p id="rateMsg" class="muted"></p>`)}
sendReview=async function(id){if(!state.picked)return toast('Выбери общую оценку');const row={teacher_id:id,user_id:state.user.id,rating:state.picked,comment:$('#comment').value.trim(),...state.scores};const r=await state.db.from('reviews').upsert(row,{onConflict:'teacher_id,user_id'});if(r.error){$('#rateMsg').textContent='Не удалось сохранить: '+r.error.message;return}closeModal();toast(`Оценка ${state.picked.toFixed(1)} сохранена`);await loadData();openTeacher(id)}
reviewCard=function(r,teacherId,votes){const up=votes.filter(v=>v.review_id===r.id&&v.is_helpful).length,down=votes.filter(v=>v.review_id===r.id&&!v.is_helpful).length,mine=votes.find(v=>v.review_id===r.id&&v.user_id===state.user?.id),local=state.localVotes[r.id],items=[['Объяснение',r.explanation],['Справедливость',r.fairness],['Атмосфера',r.atmosphere],['Вовлечённость',r.engagement],['Уважение',r.respect],['Обратная связь',r.feedback],['Нагрузка',r.workload],['Экзамены',r.exam_prep]].filter(x=>x[1]!=null);return `<article class="review"><div class="reviewHead"><div class="rating">★ ${Number(r.rating).toFixed(1)}</div><span class="muted">${formatDate(r.created_at)}</span></div>${items.length?`<div class="criteria">${items.map(([label,value])=>`<span>${label} ${Number(value).toFixed(1)}/5</span>`).join('')}</div>`:''}<p>${esc(r.comment||'Оценка без комментария')}</p><div class="reviewFooter"><span class="muted">Был ли отзыв полезен?</span><div class="helpful"><button class="${mine?.is_helpful===true||local===true?'on':''}" onclick="voteReview('${r.id}',true,'${teacherId}')">👍 Полезно ${up||''}</button><button class="${mine?.is_helpful===false||local===false?'on':''}" onclick="voteReview('${r.id}',false,'${teacherId}')">👎 Не очень ${down||''}</button></div></div></article>`}
openTeacher=async function(id){const t=state.teachers.find(x=>x.id===id);if(!t)return;const current=(location.hash||'#teachers').slice(1),from=current.startsWith('teacher/')?(history.state?.from||'teachers'):current;if(current!==`teacher/${id}`)history.pushState({from},'',`#teacher/${id}`);state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,6);localStorage.setItem('teacherRecent',JSON.stringify(state.recent));let reviews=[],votes=[];if(state.db){const r=await state.db.from('reviews').select('*').eq('teacher_id',id).order('created_at',{ascending:false}).limit(50);if(!r.error)reviews=r.data||[];if(reviews.length){const vr=await state.db.from('review_votes').select('review_id,user_id,is_helpful').in('review_id',reviews.map(x=>x.id));if(!vr.error)votes=vr.data||[]}}const bands=[['4.5–5',r=>r>=4.5],['3.5–4',r=>r>=3.5&&r<4.5],['2.5–3',r=>r>=2.5&&r<3.5],['1.5–2',r=>r>=1.5&&r<2.5],['1',r=>r<1.5]],counts=bands.map(x=>reviews.filter(r=>x[1](Number(r.rating))).length),max=Math.max(...counts,1),s=schoolOf(t);$('#app').innerHTML=`<div class="page wrap detail"><button class="soft back" onclick="go('${esc(from)}')">← Назад</button><section class="profileHero"><div class="profileTop"><div class="avatar">${esc(t.initials||initials(t.name))}</div><div class="profileTitle"><h1>${esc(t.name)}</h1><p class="muted">${esc(t.subject)} · <button class="navbtn" onclick="openSchool('${s.id}')">${esc(s.name)}</button></p><div class="rating">★ ${Number(t.rating||0).toFixed(1)} из 5</div><div style="margin-top:8px">${verificationBadge(t)}</div></div><div class="profileActions"><button class="soft" onclick="toggleFavorite('${t.id}');openTeacher('${t.id}')">${state.favorites.has(t.id)?'♥ Сохранено':'♡ Сохранить'}</button><button class="soft" onclick="shareTeacher('${t.id}')">↗ Поделиться</button><button class="primary" onclick="rate('${t.id}')">Оценить</button></div></div><div class="stats"><div class="stat"><b>${Number(t.rating||0).toFixed(1)}</b><span>рейтинг</span></div><div class="stat"><b>${Number(t.review_count||0)}</b><span>отзывов</span></div><div class="stat"><b>${Number(t.recommend_percent||0)}%</b><span>рекомендуют</span></div><div class="stat"><b>${esc(t.subject||'—')}</b><span>предмет</span></div></div></section><div class="detailGrid"><section class="panel"><h2>О преподавателе</h2><p class="bio">${esc(t.bio||'Описание профиля скоро появится.')}</p><div class="meta"><span class="pill">Подача материала</span><span class="pill">Отношение к ученикам</span><span class="pill">Обратная связь</span><span class="pill">Подготовка к экзаменам</span></div><h2 style="margin-top:30px">Отзывы учеников</h2>${reviews.length?reviews.map(r=>reviewCard(r,id,votes)).join(''):empty('Пока нет текстовых отзывов')}</section><aside><div class="panel"><h3>Распределение оценок</h3><div class="distribution">${bands.map((x,i)=>`<div class="barrow"><span>${x[0]}</span><div class="bar"><i style="width:${counts[i]/max*100}%"></i></div><span>${counts[i]}</span></div>`).join('')}</div></div><div class="panel" style="margin-top:17px"><h3>Школа</h3><p><b>${esc(s.name)}</b></p><p class="muted">⌖ ${esc([s.region,s.city].filter(Boolean).join(', '))}</p><button class="soft" onclick="openSchool('${s.id}')">Открыть школу →</button></div></aside></div>${rotatingGuideBanner()}</div>`;setActive('teachers');scrollTo(0,0)}
openTeacherRequest=function(schoolId=''){if(!state.user){state.pendingRequestSchool=schoolId||'__new__';openAuth();return toast('Войди, чтобы отправить данные на проверку')}const school=state.schools.find(s=>s.id===schoolId),region=school?.region||(state.schoolFilter.region!=='all'?state.schoolFilter.region:'');openModal(`<div class="modalhead"><h2>Добавить и проверить учителя</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Система сначала проверит нашу базу, затем официальный сайт школы и подключённый внешний реестр. Если уверенного ответа нет, заявка попадёт модератору.</p><div class="ratingNotice">✓ Отсутствие сайта не означает отказ. Не указывай личные контакты или домашний адрес учителя.</div><input id="requestSchoolId" type="hidden" value="${esc(schoolId)}"><div class="field"><label>Регион России</label><select id="requestRegion"><option value="">Выбери регион</option>${regionOptions(region)}</select></div><div class="field"><label>Город или населённый пункт</label><input id="requestCity" value="${esc(school?.city||'')}" placeholder="Например, Тула"></div><div class="field"><label>Школа</label><input id="requestSchool" value="${esc(school?.name||'')}" placeholder="Полное название или номер"></div><div class="field"><label>Полное ФИО учителя</label><input id="requestTeacher" placeholder="Как в официальных документах"></div><div class="field"><label>Предмет</label><input id="requestSubject" placeholder="Например, математика"></div><div class="field"><label>Официальная страница школы <span class="muted">(если есть)</span></label><input id="requestSource" type="url" placeholder="https://school.ru/sveden/employees/"></div><div class="field"><label>Краткое описание <span class="muted">(необязательно)</span></label><textarea id="requestBio" maxlength="500"></textarea></div><div class="field"><label>Первая оценка</label><select id="requestRating">${Array.from({length:9},(_,i)=>5-i*.5).map(n=>`<option value="${n}">${n.toFixed(1)} ★</option>`).join('')}</select></div><button class="primary" style="width:100%" onclick="sendTeacherRequest()">Отправить на автоматическую проверку</button><p id="requestMsg" class="muted"></p>`)}
sendTeacherRequest=async function(){const data={user_id:state.user.id,school_id:$('#requestSchoolId').value||null,region:$('#requestRegion').value.trim(),city:$('#requestCity').value.trim(),school_name:$('#requestSchool').value.trim(),teacher_name:$('#requestTeacher').value.trim(),subject:$('#requestSubject').value.trim(),source_url:$('#requestSource').value.trim()||null,teacher_bio:$('#requestBio').value.trim()||null,rating:Number($('#requestRating').value)};const msg=$('#requestMsg');if(!data.region||!data.city||!data.school_name||data.teacher_name.split(/\s+/).length<2||!data.subject){msg.textContent='Заполни регион, город, школу, предмет и полное имя учителя.';return}msg.textContent='Создаём заявку…';const r=await state.db.from('teacher_requests').insert(data).select('id,candidate_key,status,verification_status').single();if(r.error){msg.textContent=r.error.code==='23505'?'Ты уже отправлял этого учителя на проверку.':'Не удалось создать заявку: '+r.error.message;return}closeModal();toast('Проверяем учителя по доступным источникам…');const check=await state.db.functions.invoke('verify-teacher',{body:{request_id:r.data.id}});if(check.error)toast('Заявка в очереди: автоматический проверяющий пока недоступен');else{const outcome=check.data?.outcome;toast(outcome==='verified'?'Учитель подтверждён и опубликован ✓':outcome==='rejected'?'Совпадение не найдено':'Нужна дополнительная проверка модератором')}await loadData()}

regionsPage=function(){const selected=preferredRegion(),totalRussian=state.schools.filter(s=>s.country_code==='RU'||RU_REGIONS.includes(s.region)).length;return `<div class="page wrap section"><section class="regionHero"><div class="regionGlow"></div><div class="eyebrow">РЕГИОНАЛЬНЫЙ КАТАЛОГ</div><h1>Всё важное<br><span class="gradient">рядом с вами.</span></h1><p>Регион сохраняется в профиле и автоматически применяется к школам, учителям и анонимному чату.</p><div class="regionPicker"><b>${selected?'Текущий регион':'Выберите регион'}</b><select onchange="if(this.value)pickPreferredRegion(this.value)">${regionSelectOptions(selected)}</select></div></section><div class="metrics">${metric(RU_REGIONS.length,'регионов в навигации')}${metric(totalRussian,'российских школ в базе')}${metric(state.requests.filter(r=>r.status==='pending').length,'заявок проверяется')}${metric('24/7','доступ к каталогу')}</div><div class="sectionHead"><div><div class="eyebrow">БЫСТРЫЙ ВЫБОР</div><h2>Найдите свой регион</h2><p>Можно искать по названию или открыть федеральный округ.</p></div></div><input class="regionSearch" type="search" placeholder="Начните вводить: Тула, Москва, Татарстан…" oninput="filterRegionButtons(this.value)"><div class="districts">${Object.entries(RU_DISTRICTS).map(([district,regions],i)=>`<section class="card district"><details ${regions.includes(selected)||(!selected&&i===0)?'open':''}><summary>${district} <span>· ${regions.length}</span></summary><div class="regionChips">${regions.map(r=>`<button data-region-name="${esc(r.toLocaleLowerCase('ru'))}" class="regionChip ${selected===r?'active':''}" onclick="pickPreferredRegion('${esc(r)}')">${esc(r)}${regionCount(r)?` · ${regionCount(r)} школ`:''}</button>`).join('')}</div></details></section>`).join('')}</div><section class="section"><div class="requestHero"><div><div class="eyebrow">НЕТ В КАТАЛОГЕ?</div><h2>Добавьте учителя своего города</h2><p class="muted">Сначала данные проверит автоматика, а для мест без цифровых openAuth=function(){registerMode=false;openModal(`<div class="modalhead"><h2 id="authTitle">Войти</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Сохраняйте учителей, публикуйте отзывы и участвуйте в региональном чате.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div><div id="nameFields" class="hidden"><div class="field"><label>Имя</label><input id="first"></div><div class="field"><label>Фамилия</label><input id="last"></div><div class="field"><label>Ваш регион</label><select id="authRegion">${regionSelectOptions(preferredRegion())}</select><span class="muted">Сможете изменить позже в профиле.</span></div></div><button class="primary" style="width:100%" onclick="submitAuth()">Продолжить</button><p class="muted" id="authMsg"></p><button class="navbtn" id="switchAuth" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</button>${state.pendingRate?'<div class="ratingNotice">Можно быстро оставить оценку: <button class="navbtn" onclick="continueAsGuest()">продолжить как гость</button></div>':''}`)}
submitAuth=async function(){if(!state.db)return toast('Подключение к базе недоступно');const email=$('#email').value.trim(),password=$('#password').value,msg=$('#authMsg');if(!email||password.length<6){msg.textContent='Проверьте email и введите пароль минимум из 6 символов.';return}if(registerMode){const first=$('#first').value.trim(),last=$('#last').value.trim(),region=$('#authRegion').value;if(!first||!last||!region){msg.textContent='Укажите имя, фамилию и регион.';return}const r=await state.db.auth.signUp({email,password,options:{data:{name:`${first} ${last}`,first_name:first,last_name:last,preferred_region:region}}});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;await savePreferredRegion(region,false);account();if(r.data.session){closeModal();toast('Аккаунт создан');await resumePending()}else msg.textContent='Готово! Подтвердите почту, затем войдите.'}else{const r=await state.db.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;return}state.user=r.data.user;const region=state.user.user_metadata?.preferred_region;if(region)await savePreferredRegion(region,false);account();closeModal();toast('Добро пожаловать!');await resumePending()}}

function chatPage(){const region=state.chatRegion||preferredRegion()||'Москва';return `<div class="page wrap section"><div class="sectionHead"><div><div class="eyebrow">АНОНИМНОЕ СООБЩЕСТВО</div><h1>Чат региона</h1><p>Обсуждайте учёбу и школы без раскрытия имени.</p></div><button class="soft" onclick="go('guides')">Полезные материалы →</button></div><div class="regionPicker" style="margin-bottom:18px"><b>Регион чата</b><select onchange="changeChatRegion(this.value)">${regionSelectOptions(region)}</select></div><div class="chatLayout"><aside class="panel chatInfo"><h3>Правила безопасности</h3><div class="safetyLine">🛡️ Не публикуйте телефоны, ссылки, адреса и другие личные данные.</div><p class="muted">Нет личных сообщений. Между публикациями действует пауза. На сообщения можно пожаловаться.</p></aside><section class="panel"><div id="chatFeed" class="chatFeed">${state.chatMessages.length?state.chatMessages.map(chatMessageCard).join(''):empty('Сообщений пока нет — начните разговор')}</div><div class="chatComposer"><textarea id="chatBody" maxlength="600" placeholder="Напишите о школе, экзаменах или учёбе…"></textarea><button class="primary" onclick="sendChatMessage()">Отправить</button></div><p id="chatMsg" class="muted"></p></section></div></div>`}
async function changeChatRegion(region){if(!region)return;await savePreferredRegion(region,false);state.chatRegion=region;state.chatMessages=[];render();await loadRegionalChat()}
async function loadRegionalChat(){if(!state.db)return;const region=state.chatRegion||preferredRegion()||'Москва',feed=$('#chatFeed');const r=await state.db.from('regional_chat_messages').select('id,region,alias,body,created_at').eq('region',region).order('created_at',{ascending:true}).limit(100);if(r.error){if(feed)feed.innerHTML=empty('Чат станет доступен после обновления базы');return}state.chatMessages=r.data||[];if(feed){feed.innerHTML=state.chatMessages.length?state.chatMessages.map(chatMessageCard).join(''):empty('Сообщений пока нет — начните разговор');feed.scrollTop=feed.scrollHeight}}
async function sendChatMessage(){if(!state.user){openAuth();return toast('Войдите, чтобы написать анонимно')}const body=$('#chatBody').value.trim(),msg=$('#chatMsg');if(body.length<2){msg.textContent='Напишите сообщение.';return}const r=await state.db.from('regional_chat_messages').insert({user_id:state.user.id,region:state.chatRegion||preferredRegion()||'Москва',body});if(r.error){msg.textContent=r.error.message.includes('cooldown')?'Подождите несколько секунд перед следующим сообщением.':'Сообщение содержит запрещённую ссылку, контакт или не прошло проверку.';return}$('#chatBody').value='';await loadRegionalChat()}

function schoolCommentCard(comment){return `<article class="commentCard"><b>${esc(comment.alias||'Анонимный ученик')}</b><span class="muted"> · ${formatDate(comment.created_at)}</span><p>${esc(comment.body)}</p><button class="reportBtn" onclick="reportContent('school','${comment.id}')">⚑ Пожаловаться</button></article>`}

openSchool=async function(id){const s=state.schools.find(x=>x.id===id);if(!s)return;const list=teachersAt(id),rating=ratingOfSchool(s),subjects=[...new Set(list.map(t=>t.subject))];let comments=[];if(state.db){const r=await state.db.from('school_comments').select('id,school_id,alias,body,created_at').eq('school_id',id).order('created_at',{ascending:false}).limit(50);if(!r.error)comments=r.data||[]}state.schoolComments=comments;$('#app').innerHTML=`<div class="page wrap detail"><button class="soft back" onclick="go('schools')">← Все школы</button><section class="profileHero"><div class="profileTop"><div class="avatar">🏫</div><div class="profileTitle"><div class="eyebrow">ПРОФИЛЬ ШКОЛЫ</div><h1>${esc(s.name)}</h1><p class="muted">⌖ ${esc([s.region,s.city].filter(Boolean).join(', '))}${s.address?' · '+esc(s.address):''}</p><span class="sourceBadge ${s.source_type==='community'?'community':''}">${s.source_type==='community'?'◎ Добавлена сообществом':'✓ Данные школы проверены'}</span></div><div class="profileActions"><button class="primary" onclick="openTeacherRequest('${s.id}')">＋ Добавить учителя</button></div></div><div class="stats"><div class="stat"><b>${list.length}</b><span>учителей</span></div><div class="stat"><b>${rating?rating.toFixed(1):'—'}</b><span>средний рейтинг</span></div><div class="stat"><b>${subjects.length}</b><span>предметов</span></div><div class="stat"><b>${list.reduce((n,t)=>n+Number(t.review_count||0),0)}</b><span>оценок</span></div></div></section><section class="section"><div class="sectionHead"><div><h2>Команда школы</h2><p>${subjects.map(esc).join(' · ')}</p></div><button class="soft" onclick="openTeacherRequest('${s.id}')">Не нашли учителя?</button></div><div class="grid">${list.map(teacherCard).join('')||empty('Учителя пока не добавлены')}</div></section><section class="panel"><div class="sectionHead"><div><div class="eyebrow">АНОНИМНО</div><h2>Комментарии о школе</h2><p>Общие вопросы и опыт учеников — без личных сообщений.</p></div></div><div class="safetyLine">🛡️ Пишите о своём опыте и не публикуйте контакты или личные данные.</div><div class="chatComposer"><textarea id="schoolCommentBody" maxlength="600" placeholder="Расскажите о школе или задайте общий вопрос…"></textarea><button class="primary" onclick="sendSchoolComment('${id}')">Опубликовать</button></div><p id="schoolCommentMsg" class="muted"></p><div class="commentList">${comments.length?comments.map(schoolCommentCard).join(''):empty('Комментариев пока нет')}</div></section>${rotatingGuideBanner()}</div>`;setActive('schools');scrollTo(0,0)}

function comparePickerRows(query=''){const q=query.trim().toLocaleLowerCase('ru'),list=state.teachers.filter(t=>{const s=schoolOf(t);return!q||[t.name,t.subject,s.name,s.city].some(v=>String(v||'').toLocaleLowerCase('ru').includes(q))}).slice(0,8);return list.map(t=>{const selected=state.compare.includes(t.id);return `<button class="compareResult" onclick="toggleComparePicker('${t.id}')"><span class="avatar">${esc(t.initials||initials(t.name))}</span><span><b>${esc(t.name)}</b><small>${esc(t.subject)} · ★ ${Number(t.rating||0).toFixed(1)}</small></span><span class="soft">${selected?'Убрать':'Добавить'}</span></button>`}).join('')||empty('Учителя не найдены')}

function setManualScore(value){const n=Number(value);if(!Number.isFinite(n))return;state.picked=Math.min(5,Math.max(1,Math.round(n*10)/10));const input=$('#manualScoreInput');if(input&&document.activeElement!==input)input.value=state.picked.toFixed(1);$$('.quickScores button').forEach(b=>b.classList.toggle('sel',Number(b.dataset.score)===state.picked))}

rate=async function(id){if(!state.db)return toast('Подключение к базе недоступно');if(!state.user){state.pendingRate=id;openAuth();return toast('Войдите или продолжите как гость')}const t=state.teachers.find(x=>x.id===id);if(!t)return;const existing=await state.db.from('reviews').select('*').eq('teacher_id',id).eq('user_id',state.user.id).maybeSingle();const old=existing.data,defaults={explanation:5,fairness:5,atmosphere:5,engagement:5,respect:5,feedback:5,workload:5,exam_prep:5};state.picked=Number(old?.rating||4.5);state.scores=Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,Number(old?.[k]??v)]));openModal(`<div class="modalhead"><div><div class="eyebrow">ВАША ОЦЕНКА</div><h2>${old?'Изменить':'Оценить'} ${esc(t.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Введите оценку от 1,0 до 5,0</label><div class="manualScore"><button onclick="stepManualScore(-.1)" aria-label="Уменьшить">−</button><div class="manualScoreBox"><input id="manualScoreInput" type="number" min="1" max="5" step="0.1" value="${state.picked.toFixed(1)}" inputmode="decimal" oninput="setManualScore(this.value)" onblur="this.value=state.picked.toFixed(1)"><span>/ 5</span></div><button onclick="stepManualScore(.1)" aria-label="Увеличить">＋</button></div><div class="quickScores">${[1,2,3,4,5].map(n=>`<button data-score="${n}" class="${n===state.picked?'sel':''}" onclick="setManualScore(${n});$('#manualScoreInput').value='${n.toFixed(1)}'">${n} ★</button>`).join('')}</div></div><details class="criteriaDetails"><summary>Оценки по критериям</summary><div class="criteriaGrid">${criterion('Понятность объяснений','explanation')}${criterion('Справедливость','fairness')}${criterion('Атмосфера','atmosphere')}${criterion('Вовлечённость','engagement')}${criterion('Уважение к ученикам','respect')}${criterion('Обратная связь','feedback')}${criterion('Разумность нагрузки','workload')}${criterion('Подготовка к экзаменам','exam_prep')}</div></details><div class="field"><label>Комментарий</label><textarea id="comment" maxlength="1200" placeholder="Опишите конкретный учебный опыт без личных данных…">${esc(old?.comment||'')}</textarea></div><button class="primary stickyRate" style="width:100%" onclick="sendReview('${id}')">${old?'Сохранить изменения':'Опубликовать отзыв'}</button><p id="rateMsg" class="muted"></p>`)}

function unifiedResultMarkup(){const q=state.rateSearch.q.trim(),type=state.rateSearch.type;if(q.length<2)return `<div class="searchStart"><div><i>⌕</i><b>Введите имя учителя, предмет или название школы</b></div></div>`;const teachers=type==='schools'?[]:unifiedTeacherResults(q),schools=type==='teachers'?[]:unifiedSchoolResults(q);if(!teachers.length&&!schools.length)return `<div class="unifiedEmpty">Ничего не найдено. Попробуйте предмет, номер школы, город или фамилию.</div>`;return `${teachers.length?`<section class="resultGroup"><div class="resultGroupHead"><h2>Учителя</h2><span>${teachers.length} результатов</span></div>${teachers.map(t=>{const s=schoolOf(t);return `<article class="unifiedResult teacherResult"><span class="avatar">${esc(t.initials||initials(t.name))}</span><div><h3>${esc(t.name)}</h3><p>${esc(t.subject)} · ${esc(s.name)} · ★ ${Number(t.rating||0).toFixed(1)}</p></div><div class="unifiedResultActions"><button class="primary" onclick="openTeacher('${t.id}')">Открыть профиль</button></div></article>`}).join('')}</section>`:''}${schools.length?`<section class="resultGroup"><div class="resultGroupHead"><h2>Школы</h2><span>${schools.length} результатов</span></div>${schools.map(s=>`<article class="unifiedResult"><span class="schoolIcon">🏫</span><div><h3>${esc(s.name)}</h3><p>${esc([s.region,s.city,s.address].filter(Boolean).join(' · '))}</p></div><div class="unifiedResultActions"><button class="primary" onclick="openSchool('${s.id}')">Профиль школы</button><button class="soft" onclick="showSchoolTeachers('${s.id}')">Её учителя</button></div></article>`).join('')}</section>`:''}`}
function rateSearchPage(){return `<div class="page wrap rateSearchPage"><section class="rateSearchHead"><div class="eyebrow">ОЦЕНИ УЧИТЕЛЯ</div><h1>Кого вы ищете?</h1><p>Один поиск по преподавателям и школам.</p></section><div class="unifiedSearch"><div class="searchbox">⌕ <input id="rateSearchInput" type="search" autocomplete="off" enterkeyhint="search" value="${esc(state.rateSearch.q)}" placeholder="Учитель, предмет, школа или город" oninput="updateRateSearch(this.value)"></div><button class="soft" aria-label="Очистить поиск" onclick="clearRateSearch()">×</button></div><nav class="searchTypeTabs" aria-label="Тип результатов"><button class="${state.rateSearch.type==='all'?'active':''}" onclick="setRateSearchType('all')">Все</button><button class="${state.rateSearch.type==='teachers'?'active':''}" onclick="setRateSearchType('teachers')">Учителя</button><button class="${state.rateSearch.type==='schools'?'active':''}" onclick="setRateSearchType('schools')">Школы</button></nav><section id="unifiedResults" class="unifiedResults">${unifiedResultMarkup()}</section><aside class="miniMatch"><div><b>Не знаете, кого выбрать?</b><span>Умный подбор задаст три коротких вопроса.</span></div><button class="soft" onclick="openMatch()">✦ Умный подбор</button></aside></div>`}

function setSchoolScore(value){const n=Number(value);if(!Number.isFinite(n))return;state.schoolPicked=Math.min(5,Math.max(1,Math.round(n*10)/10));const input=$('#schoolScoreInput');if(input&&document.activeElement!==input)input.value=state.schoolPicked.toFixed(1)}
function stepSchoolScore(delta){setSchoolScore(Number(state.schoolPicked||4.5)+delta);const input=$('#schoolScoreInput');if(input)input.value=state.schoolPicked.toFixed(1)}
async function openSchoolRating(id){if(!state.user){state.pendingSchoolRating=id;openAuth();return toast('Войдите, чтобы оценить школу')}let old=null;if(state.db){const r=await state.db.from('school_reviews').select('rating,comment').eq('school_id',id).eq('user_id',state.user.id).maybeSingle();if(!r.error)old=r.data}const school=state.schools.find(s=>s.id===id);state.schoolPicked=Number(old?.rating||4.5);openModal(`<div class="modalhead"><div><div class="eyebrow">ОЦЕНКА ШКОЛЫ</div><h2>${esc(school?.name||'Школа')}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Оценка от 1,0 до 5,0</label><div class="manualScore"><button onclick="stepSchoolScore(-.1)">−</button><div class="manualScoreBox"><input id="schoolScoreInput" type="number" min="1" max="5" step="0.1" inputmode="decimal" value="${state.schoolPicked.toFixed(1)}" oninput="setSchoolScore(this.value)" onblur="this.value=state.schoolPicked.toFixed(1)"><span>/ 5</span></div><button onclick="stepSchoolScore(.1)">＋</button></div></div><div class="field"><label>Короткий комментарий</label><textarea id="schoolRatingComment" maxlength="800" placeholder="Что важно знать ученикам и родителям?">${esc(old?.comment||'')}</textarea></div><button class="primary" style="width:100%" onclick="sendSchoolRating('${id}')">Сохранить оценку</button><p id="schoolRatingMsg" class="muted"></p>`)}
async function sendSchoolRating(id){const msg=$('#schoolRatingMsg');if(!state.db){msg.textContent='Нет подключения к базе.';return}const r=await state.db.from('school_reviews').upsert({school_id:id,user_id:state.user.id,rating:state.schoolPicked,comment:$('#schoolRatingComment').value.trim()},{onConflict:'school_id,user_id'});if(r.error){msg.textContent=r.error.message.includes('school_reviews')?'Сначала примените миграцию оценок школ.':'Не удалось сохранить: '+r.error.message;return}closeModal();toast('Оценка школы сохранена');await openSchool(id)}

async function refreshTeacherStats(id){const t=state.teachers.find(x=>x.id===id),stats=$('.teacherDetail .stats');if(!t||!stats)return;const rating=Number(t.rating||0),reviews=Number(t.review_count||0),recommend=Number(t.recommend_percent||0);stats.classList.add('profileStatRibbon','modernStats');stats.innerHTML=profileStat('★',rating.toFixed(1),'общая оценка',rating/5*100,'amber')+profileStat('💬',reviews,'отзывов учеников',Math.min(100,reviews*2),'brand')+profileStat('👍',`${recommend}%`,'рекомендуют',recommend,'green');applyMotionEffects()}

div><button class="primary" style="width:100%" onclick="sendDirectorRating('${id}')">Сохранить оценку директора</button><p id="directorRatingMsg" class="muted"></p>`)}
async function sendDirectorRating(id){const msg=$('#directorRatingMsg');if(!state.db){msg.textContent='Нет подключения к базе.';return}const row={school_id:id,user_id:state.user.id,director_name:$('#directorName').value.trim()||null,rating:state.directorPicked,leadership:state.directorScores.leadership,fairness:state.directorScores.fairness,communication:state.directorScores.communication,safety:state.directorScores.safety,comment:$('#directorComment').value.trim()},r=await state.db.from('director_reviews').upsert(row,{onConflict:'school_id,user_id'});if(r.error){msg.textContent=r.error.message.includes('director_reviews')?'Сначала примените новую миграцию оценок директоров.':'Не удалось сохранить: '+r.error.message;return}closeModal();toast('Оценка директора сохранена');await openSchool(id)}

/* Compact search, modern rating composer and review cards v14 */
function normalizeSearchV14(value){return String(value||'').toLocaleLowerCase('ru').replaceAll('ё','е').replace(/№/g,' ').replace(/[^a-zа-я0-9]+/gi,' ').trim()}
function searchRankV14(fields,query){const hay=normalizeSearchV14(fields.join(' ')),q=normalizeSearchV14(query),tokens=q.split(/\s+/).filter(Boolean);if(!tokens.length||!tokens.every(token=>hay.includes(token)))return-1;let score=0;if(hay===q)score+=100;if(hay.startsWith(q))score+=45;if(hay.includes(` ${q}`))score+=25;tokens.forEach(token=>{if(hay.split(' ').some(word=>word.startsWith(token)))score+=12;else score+=5});return score}
unifiedTeacherResults=function(q){return state.teachers.map(t=>{const s=schoolOf(t);return{item:t,rank:searchRankV14([t.name,t.subject,s.name,s.city,s.region],q)}}).filter(x=>x.rank>=0).sort((a,b)=>b.rank-a.rank||Number(b.item.rating||0)-Number(a.item.rating||0)).slice(0,12).map(x=>x.item)}
unifiedSchoolResults=function(q){return state.schools.map(s=>({item:s,rank:searchRankV14([s.name,s.city,s.region,s.address],q)})).filter(x=>x.rank>=0).sort((a,b)=>b.rank-a.rank||String(a.item.name).localeCompare(String(b.item.name),'ru')).slice(0,10).map(x=>x.item)}

function openRatingComposerV14(t,old,isDemo){const defaults={explanation:5,fairness:5,atmosphere:5,engagement:5,respect:5,feedback:5,workload:5,exam_prep:5};state.picked=Number(old?.rating||4.5);state.scores=Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,Number(old?.[k]??v)]));const mood=ratingMoodV14(state.picked);openModal(`<div class="ratingComposer"><div class="modalhead"><div><div class="eyebrow">${isDemo?'ДЕМО-ОТЗЫВ':'ВАШ ОПЫТ'}</div><h2>${old?'Изменить оценку':'Оценить учителя'}</h2><p class="muted">${esc(t.name)}</p></div><button class="close" onclick="closeModal()">×</button></div><section class="ratingScoreHero"><div class="ratingOrb"><div><b id="ratingOrbValue">${state.picked.toFixed(1)}</b><small>из 5,0</small></div></div><div class="ratingScoreCopy"><div class="ratingMood" id="ratingMood">${mood[0]} ${mood[1]}</div><p>Выберите точную оценку с шагом 0,1.</p><div class="ratingStepper"><button onclick="stepManualScore(-.1)" aria-label="Уменьшить">−</button><input id="manualScoreInput" type="number" min="1" max="5" step="0.1" inputmode="decimal" value="${state.picked.toFixed(1)}" oninput="setManualScore(this.value)" onblur="this.value=state.picked.toFixed(1)"><button onclick="stepManualScore(.1)" aria-label="Увеличить">＋</button></div></div></section><div class="ratingQuick">${[1,2,3,4,5].map(n=>`<button data-score="${n}" class="${n===state.picked?'sel':''}" onclick="setManualScore(${n})">${n} ★</button>`).join('')}</div><details><summary>Точнее по критериям</summary><div class="criteriaGrid">${criterion('Понятность объяснений','explanation')}${criterion('Справедливость','fairness')}${criterion('Атмосфера','atmosphere')}${criterion('Вовлечённость','engagement')}${criterion('Уважение к ученикам','respect')}${criterion('Обратная связь','feedback')}${criterion('Разумность нагрузки','workload')}${criterion('Подготовка к экзаменам','exam_prep')}</div></details><div class="field ratingComment"><label>Ваш отзыв <span class="muted">необязательно</span> rate=async function(id){if(!state.user){state.pendingRate=id;openAuth();return toast('Войдите в быстрый демо-режим')}const t=state.teachers.find(x=>x.id===id);if(!t)return;let old=null;if(state.demoMode)old=state.reviews.find(r=>r.teacher_id===id&&r.user_id===LOCAL_DEMO_USER_ID_V13)||null;else{if(!state.db)return toast('Подключение к базе недоступно');const result=await state.db.from('reviews').select('*').eq('teacher_id',id).eq('user_id',state.user.id).maybeSingle();if(result.error)return toast('Не удалось открыть форму оценки');old=result.data}openRatingComposerV14(t,old,state.demoMode)}
reviewCard=function(r,teacherId,votes=[]){const safeVotes=Array.isArray(votes)?votes:[],up=safeVotes.filter(v=>v.review_id===r.id&&v.is_helpful).length,down=safeVotes.filter(v=>v.review_id===r.id&&!v.is_helpful).length,mine=safeVotes.find(v=>v.review_id===r.id&&v.user_id===state.user?.id),local=state.localVotes[r.id],score=Math.min(100,Math.max(0,Number(r.rating||0)/5*100)),items=[['Объяснение',r.explanation],['Справедливость',r.fairness],['Атмосфера',r.atmosphere],['Уважение',r.respect],['Связь',r.feedback],['Экзамены',r.exam_prep]].filter(x=>x[1]!=null).slice(0,4);return `<article class="review"><div class="reviewHead"><div class="reviewScore"><span class="reviewScoreOrb" style="--score:${score}" data-score="${Number(r.rating||0).toFixed(1)}"></span><span><b>${ratingMoodV14(Number(r.rating||0))[1]}</b><small>оценка ученика</small></span></div><span class="muted">${formatDate(r.created_at)}</span></div>${items.length?`<div class="criteria">${items.map(([label,value])=>`<span>${label} ${Number(value).toFixed(1)}</span>`).join('')}</div>`:''}<p>${esc(r.comment||'Оценка без текстового комментария')}</p><div class="reviewFooter"><span class="muted">Полезный отзыв?</span><div class="helpful"><button class="${mine?.is_helpful===true||local===true?'on':''}" onclick="voteReview('${r.id}',true,'${teacherId}')">👍 ${up||'Полезно'}</button><button class="${mine?.is_helpful===false||local===false?'on':''}" onclick="voteReview('${r.id}',false,'${teacherId}')">👎 ${down||'Не очень'}</button></div></div></article>`}

const savePreferredRegionBeforeV18=savePreferredRegion;

openRegionOnboarding=function(){state.regionOnboardingRequired=true;openModal(`<div class="regionSetupV18"><div class="regionSetupIcon">⌖</div><div class="eyebrow">ПЕРВЫЙ ЗАПУСК</div><h2>Выберите свой регион</h2><p>Сделайте это один раз. Мы автоматически настроим школы, учителей и региональный чат.</p><div class="field"><label>Регион России</label><select id="onboardingRegion" autofocus>${regionSelectOptions('')}</select></div><div class="regionSetupNote">✓ Позже регион можно изменить в личном профиле</div><button class="primary" style="width:100%" onclick="completeRegionOnboarding()">Продолжить →</button></div>`)}
completeRegionOnboarding=async function(){const region=$('#onboardingRegion')?.value;if(!region)return toast('Сначала выберите регион');await savePreferredRegion(region,false);state.regionOnboardingRequired=false;closeModalBeforeRegionV18();render();toast(`Ваш регион: ${region}`)}
skipRegionOnboarding=function(){toast('Регион нужен для настройки каталога')}
selectedRateRegionV17=function(){return preferredRegion()||'all'}
rateRegionMatchesV17=function(school){const region=preferredRegion();return !region||school?.region===region}
rateSearchPage=function(){const region=preferredRegion(),hasQuery=Boolean(state.rateSearch.q.trim());return `<div class="page wrap rateSearchPage"><section class="rateSearchHead"><div class="eyebrow">ОЦЕНИ УЧИТЕЛЯ</div><h1>Найдите учителя или школу</h1><p>Каталог уже настроен под ваш регион.</p><span class="activeRegionBadge">⌖ ${esc(region||'Регион не выбран')} <button onclick="go('profile')">· изменить в профиле</button></span></section><button class="sideMatchButton" onclick="openMatch()">✦ <span>Умный подбор</span></button><section class="searchMenu"><div class="unifiedSearch"><div class="searchbox">⌕ <input id="rateSearchInput" type="search" autocomplete="off" enterkeyhint="search" value="${esc(state.rateSearch.q)}" placeholder="Фамилия учителя или название школы" oninput="updateRateSearch(this.value)" aria-label="Поиск учителя или школы"></div><button class="soft clearSearchButton ${hasQuery?'hasQuery':''}" aria-label="Очистить поиск" onclick="clearRateSearch()">×</button></div><nav class="searchTypeTabs" aria-label="Показывать в результатах"><button class="${state.rateSearch.type==='all'?'active':''}" onclick="setRateSearchType('all')">Все</button><button class="${state.rateSearch.type==='teachers'?'active':''}" onclick="setRateSearchType('teachers')">Учителя</button><button class="${state.rateSearch.type==='schools'?'active':''}" onclick="setRateSearchType('schools')">Школы</button></nav></section><section id="unifiedResults" class="unifiedResults" aria-live="polite">${unifiedResultMarkup()}</section></div>`}
function regionalSchoolsCatalogV18(){const region=preferredRegion(),f=state.schoolFilter,q=normalizeSearchV14(f.q);let list=state.schools.filter(s=>(!region||s.region===region)&&(!q||searchRankV14([s.name,s.city,s.address],q)>=0));list.sort((a,b)=>f.sort==='name'?a.name.localeCompare(b.name,'ru'):f.sort==='teachers'?teachersAt(b.id).length-teachersAt(a.id).length:ratingOfSchool(b)-ratingOfSchool(a));return `<div class="page wrap section"><div class="sectionHead"><div><div class="eyebrow">ШКОЛЫ ВАШЕГО РЕГИОНА</div><h1 class="regionalCatalogTitle">${esc(region||'Выберите регион')}</h1><span class="activeRegionBadge">⌖ Регион из профиля <button onclick="go('profile')">· изменить</button></span></div><button class="primary" onclick="openTeacherRequest()">＋ Добавить учителя</button></div><div class="toolbar"><input id="schoolFilterInput" class="filterInput" value="${esc(f.q)}" placeholder="Название школы" oninput="updateQuery('school',this)"><select class="filterSelect" onchange="state.schoolFilter.sort=this.value;render()"><option value="rating">По рейтингу</option><option value="teachers" ${f.sort==='teachers'?'selected':''}>По числу учителей</option><option value="name" ${f.sort==='name'?'selected':''}>По названию</option></select><span class="resultCount">Школ: ${list.length}</span></div><div class="grid">${list.map(schoolCard).join('')||empty('В этом регионе школы пока не добавлены')}</div></div>`}
schoolHubPage=function(){return regionalSchoolsCatalogV18()}
schoolCatalogView=function(){return regionalSchoolsCatalogV18()}
regionsPage=function(){const selected=preferredRegion();return `<div class="page wrap section"><section class="regionHero"><div class="regionGlow"></div><div class="eyebrow">ВАШ РЕГИОН</div><h1>${esc(selected||'Регион не выбран')}</h1><p>Этот регион автоматически используется в школах, поиске учителей и анонимном чате.</p><div class="profileActions"><button class="primary" onclick="go('profile')">Изменить в профиле →</button></div></section><div class="sectionHead" style="margin-top:34px"><div><div class="eyebrow">ПОКРЫТИЕ КАТАЛОГА</div><h2>Регионы России</h2><p>Каталог уже содержит тестовые школы во всех 85 регионах.</p></div></div><div class="districts">${Object.entries(RU_DISTRICTS).map(([district,regions])=>`<section class="card district"><h3>${district} <span>${regions.length}</span></h3><div class="regionChips">${regions.map(region=>`<span class="regionChip ${selected===region?'active':''}">${esc(region)}${regionCount(region)?` · ${regionCount(region)}`:''}</span>`).join('')}</div></section>`).join('')}</div></div>`}
const openTeacherRequestBeforeRegionV18=openTeacherRequest;
openTeacherRequest=function(schoolId=''){const result=openTeacherRequestBeforeRegionV18(schoolId);requestAnimationFrame(()=>{const select=$('#requestRegion');if(!select)return;const school=state.schools.find(s=>s.id===schoolId),region=school?.region||preferredRegion();if(region)select.value=region;const field=select.closest('.field');if(field)field.hidden=true});return result}
openMatch=function(){const subjects=[...new Set(state.teachers.filter(t=>schoolOf(t).region===preferredRegion()).map(t=>t.subject).filter(Boolean))].sort(),region=preferredRegion();openModal(`<div class="modalhead"><div><div class="eyebrow">${esc(region)}</div><h2>✦ Умный подбор</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Ищем среди преподавателей вашего региона.</p><div class="field"><label>Какой предмет нужен?</label><select id="matchSubject"><option value="all">Любой предмет</option>${subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Что важнее?</label><select id="matchGoal"><option value="rating">Максимальный рейтинг</option><option value="reviews">Много отзывов</option><option value="recommend">Рекомендации учеников</option></select></div><button class="primary" style="width:100%" onclick="runMatch()">Найти совпадение →</button>`)}
runMatch=function(){const subject=$('#matchSubject').value,goal=$('#matchGoal').value,region=preferredRegion();let pool=state.teachers.filter(t=>(!region||schoolOf(t).region===region)&&(subject==='all'||t.subject===subject));pool.sort((a,b)=>goal==='reviews'?Number(b.review_count)-Number(a.review_count):goal==='recommend'?Number(b.recommend_percent)-Number(a.recommend_percent):Number(b.rating)-Number(a.rating));if(!pool.length)return toast('В вашем регионе подходящий профиль пока не найден');closeModal();openTeacher(pool[0].id);toast('Нашли лучшее совпадение ✦')}
const profilePageBeforeRegionV18=profilePage;
profilePage=function(){const markup=profilePageBeforeRegionV18();return markup.replace('<button class="soft" onclick="go(\'regions\')">Открыть карту</button>','').replace('Один выбор применяется к каталогу, рекомендациям и чату.','Регион применяется автоматически ко всему сайту. Изменить его можно здесь.')}
openAuth=function(){if(!preferredRegion()){openRegionOnboarding();return toast('Сначала выберите регион')}openModal(`<div class="modalhead"><div><div class="eyebrow">${esc(preferredRegion())}</div><h2>Войти без регистрации</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Регион уже сохранён. Демо-режим работает без почты и пароля.</p><div class="ratingNotice">⚡ Избранное и тестовые действия сохранятся на этом устройстве.</div><button class="primary" style="width:100%;margin-top:16px" onclick="quickTestLogin()">Войти в демо-режим →</button><p id="authMsg" class="muted">Регион можно изменить в профиле.</p>`)}
quickTestLogin=async function(){const region=preferredRegion();if(!region)return openRegionOnboarding();state.demoMode=true;state.user=localDemoUserV13(region);localStorage.setItem('teacherPlusDemoMode','1');applyPreferredRegionV18(region);hydrateLocalDemoV13();account();closeModalBeforeRegionV18();toast(`Демо-вход · ${region}`);await resumePending()}
const loadDataBeforeRegionV18=loadData;
loadData=async function(){const localBefore=localStorage.getItem('preferredRegion');if(!localBefore)localStorage.removeItem('regionPromptSeen');await loadDataBeforeRegionV18();const region=preferredRegion();if(region){applyPreferredRegionV18(region);localStorage.setItem('regionPromptSeen','1');render()}else{localStorage.removeItem('regionPromptSeen');setTimeout(openRegionOnboarding,300)}}

/* Remove duplicated score cards and upgrade catalog search v19 */
function removeRepeatedScoreCardsV19(root){if(!root)return;const stats=root.querySelector('.stats');if(!stats)return;stats.querySelectorAll('.stat').forEach(card=>{const label=[...card.querySelectorAll(':scope > span')].at(-1)?.textContent.toLocaleLowerCase('ru')||'';if(label.includes('оценк')||label.includes('рейтинг'))card.remove()});stats.classList.add('compactStatsV19')}
function cleanTeacherProfileV19(){const root=$('.teacherDetail');if(!root)return;root.querySelector('.profileTop .rating')?.remove();root.querySelector('.profileTop .profileActions')?.remove();removeRepeatedScoreCardsV19(root)}
function cleanSchoolProfileV19(){const root=$('.schoolCompactProfile');if(!root)return;removeRepeatedScoreCardsV19(root);root.querySelector('.schoolScoreDeck .schoolRatingPanel:not(.directorRatingPanel)')?.remove()}
const openTeacherBeforeV19=openTeacher;
openTeacher=async function(id){await openTeacherBeforeV19(id);cleanTeacherProfileV19()}
const openSchoolBeforeV19=openSchool;
openSchool=async function(id){await openSchoolBeforeV19(id);cleanSchoolProfileV19()}
rateSearchPage=function(){const region=preferredRegion(),hasQuery=Boolean(state.rateSearch.q.trim());return `<div class="page wrap rateSearchPage"><section class="searchStageV19"><div class="searchStageTopV19"><div><div class="eyebrow">ПОИСК И ОЦЕНКА</div><h1>Кого ищем?</h1><p>Учителя и школы ${esc(region)} — в одном живом каталоге.</p></div><button class="searchRegionV19" onclick="go('profile')"><i>⌖</i><span>${esc(region)}<br><small>изменить в профиле</small></span></button></div><div class="searchCommandV19"><span class="searchCommandIconV19">⌕</span><input id="rateSearchInput" type="search" autocomplete="off" enterkeyhint="search" value="${esc(state.rateSearch.q)}" placeholder="Фамилия учителя или название школы" oninput="updateRateSearch(this.value)" aria-label="Поиск учителя или школы"><kbd>/</kbd><button class="soft clearSearchButton ${hasQuery?'hasQuery':''}" aria-label="Очистить поиск" onclick="clearRateSearch()">×</button></div><div class="searchToolsV19"><nav class="searchTypeTabs" aria-label="Показывать в результатах"><button class="${state.rateSearch.type==='all'?'active':''}" onclick="setRateSearchType('all')">Все</button><button class="${state.rateSearch.type==='teachers'?'active':''}" onclick="setRateSearchType('teachers')">Учителя</button><button class="${state.rateSearch.type==='schools'?'active':''}" onclick="setRateSearchType('schools')">Школы</button></nav><button class="smartMiniV19" onclick="openMatch()">✦ Умный подбор</button></div></section><section id="unifiedResults" class="unifiedResults searchResultsV19" aria-live="polite">${unifiedResultMarkup()}</section></div>`}

/* Restore original profile statistics, remove the lower duplicate score block and compact search v20 */
cleanTeacherProfileV19=function(){const root=$('.teacherDetail');if(!root)return;root.querySelector('.scoreSpotlight')?.remove();root.querySelector('.stats')?.classList.remove('compactStatsV19')}
cleanSchoolProfileV19=function(){const root=$('.schoolCompactProfile');if(!root)return;root.querySelector('.scoreSpotlight')?.remove();root.querySelector('.stats')?.classList.remove('compactStatsV19')}
rateSearchPage=function(){const hasQuery=Boolean(state.rateSearch.q.trim());return `<div class="page wrap rateSearchPage"><section class="searchCompactV20"><div class="searchCompactHeadV20"><div><div class="eyebrow">ОЦЕНИ УЧИТЕЛЯ</div><h1>Найдите профиль</h1></div></div><div class="searchLineV20"><span>⌕</span><input id="rateSearchInput" type="search" autocomplete="off" enterkeyhint="search" value="${esc(state.rateSearch.q)}" placeholder="Учитель или школа" oninput="updateRateSearch(this.value)" aria-label="Поиск учителя или школы"><button class="soft clearSearchButton ${hasQuery?'hasQuery':''}" aria-label="Очистить поиск" onclick="clearRateSearch()">×</button></div><div class="searchCompactToolsV20"><nav class="searchTypeTabs" aria-label="Показывать в результатах"><button class="${state.rateSearch.type==='all'?'active':''}" onclick="setRateSearchType('all')">Все</button><button class="${state.rateSearch.type==='teachers'?'active':''}" onclick="setRateSearchType('teachers')">Учителя</button><button class="${state.rateSearch.type==='schools'?'active':''}" onclick="setRateSearchType('schools')">Школы</button></nav><button class="smartMiniV19" onclick="openMatch()">✦ Умный подбор</button></div></section><section id="unifiedResults" class="unifiedResults searchResultsV19 searchCompactResultsV20" aria-live="polite">${unifiedResultMarkup()}</section></div>`}
document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';$('#themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';
window.addEventListener('hashchange',render);window.addEventListener('popstate',render);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideSuggest()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();($('#homeSearch')||$('#rateSearchInput')||$('#teacherHubSearch')||$('#teacherFilterInput')||$('#schoolFilterInput')||$('#globalSearch'))?.focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('.heroSearch')&&!e.target.closest('.focusSearch')&&!e.target.closest('.unifiedSearch'))hideSuggest()});new MutationObserver(()=>requestAnimationFrame(injectGuideBanner)).observe($('#app'),{childList:true,subtree:false});loadData();
</script>
