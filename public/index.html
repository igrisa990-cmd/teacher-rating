<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учитель+ — рейтинг учителей</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/runtime-config.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#152033;--muted:#718096;--line:#e6eaf1;--brand:#635bff;--brand2:#8b5cf6;--good:#00a98f;--shadow:0 16px 45px rgba(30,40,70,.1)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 0 0,#e9e7ff,transparent 65%),radial-gradient(700px 400px at 100% 0,#dcfaf4,transparent 65%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}nav{height:70px;display:flex;align-items:center;gap:18px}.logo{font-size:21px;font-weight:900}.logo b{color:var(--brand)}.search{flex:1;position:relative;max-width:560px}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 15px 0 42px;background:#f9fafc;outline:0}.search span{position:absolute;left:14px;top:11px}.suggest{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;display:none}.suggest.show{display:block}.suggest div{padding:12px 15px}.suggest div:hover{background:#f5f6ff}.navbtn{border:0;background:transparent;font-weight:700}.primary{background:var(--brand);color:white;border:0;border-radius:12px;padding:11px 17px;font-weight:800}.soft{background:#eef0ff;color:#4e46d9;border:0;border-radius:12px;padding:11px 15px;font-weight:800}
main{min-height:calc(100vh - 70px)}.hero{padding:72px 0 42px}.hero h1{font-size:clamp(38px,6vw,68px);line-height:.98;letter-spacing:-3px;margin:0 0 20px;max-width:800px}.hero p{font-size:18px;color:var(--muted);max-width:650px}.heroSearch{display:flex;gap:10px;max-width:720px;margin-top:28px}.heroSearch input{flex:1;border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--shadow);outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px #26334a08}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);transition:.2s}.section{padding:30px 0 60px}.section h2{font-size:30px;margin:0 0 20px}.muted{color:var(--muted)}.stars{color:#e4a514;font-weight:900}.teacher{display:flex;gap:14px;align-items:flex-start}.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#635bff,#9b8cff);color:#fff;display:grid;place-items:center;font-weight:900}.teacher h3{margin:0 0 5px}.pill{display:inline-block;padding:5px 9px;border-radius:9px;background:#f0f2f8;color:#59657a;font-size:12px;font-weight:700;margin-top:8px}.actions{display:flex;gap:8px;margin-top:15px}.list{display:grid;gap:12px}.school{cursor:pointer}.empty{padding:45px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccd3df;border-radius:20px}
.detail{max-width:900px;padding:45px 0}.back{margin-bottom:18px}.profile{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.profileTop{display:flex;gap:20px;align-items:center}.profile .avatar{width:88px;height:88px;font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{padding:15px;background:#f7f8fc;border-radius:14px}.stat b{font-size:24px;display:block}
.modal{position:fixed;inset:0;background:#17203355;backdrop-filter:blur(5px);display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;border-radius:22px;padding:25px;width:min(460px,100%);box-shadow:0 30px 80px #11182744}.modalhead{display:flex;justify-content:space-between}.close{border:0;background:#f1f3f7;border-radius:10px;width:36px;height:36px}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}.field textarea{min-height:100px;resize:vertical}.pick{display:flex;gap:7px}.pick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}.pick button.sel{background:#fff4d5;border-color:#e4a514}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#152033;color:white;padding:12px 17px;border-radius:12px;display:none;z-index:70}.toast.show{display:block}
@media(max-width:800px){.grid{grid-template-columns:1fr}.navbtn{display:none}.hero{padding-top:45px}.stats{grid-template-columns:1fr}.heroSearch{flex-direction:column}.search{max-width:none}.profileTop{align-items:flex-start}}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:linear-gradient(135deg,#635bff33,#00a98f22);right:4%;top:30px;filter:blur(3px);animation:float 7s ease-in-out infinite;pointer-events:none}@keyframes float{50%{transform:translateY(20px) scale(1.05)}}.card,.profile{transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-4px)}.section{animation:pagein .3s ease}@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.profile h1{font-size:clamp(30px,5vw,48px);margin:0}.profile .bio{font-size:17px;line-height:1.7}.teacherMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.heroSearch{position:relative;z-index:2}.school .pill{margin-bottom:10px}.brandHome{display:flex;align-items:center;gap:10px;color:inherit}.hero{min-height:470px;display:flex;flex-direction:column;justify-content:center}.hero p{line-height:1.65}.heroSearch input:focus,.search input:focus,.field input:focus,.field textarea:focus{border-color:#8b82ff;box-shadow:0 0 0 4px #635bff12}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:#536074}.homeStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.homeStat{background:#ffffffb8;border:1px solid var(--line);border-radius:18px;padding:18px}.homeStat b{font-size:27px;display:block}.profileHero{background:linear-gradient(135deg,#fff,#f3f2ff);border-radius:25px;padding:30px}.profileActions{display:flex;gap:10px;flex-wrap:wrap}.ratingBig{font-size:46px;font-weight:900;line-height:1}.reviewItem{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff}.reviewMeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.teacherSchool{font-size:13px;color:var(--muted);margin-top:3px}@media(max-width:800px){.navbtn{display:block}.homeStats{grid-template-columns:1fr}.hero{min-height:410px}.search{order:5;width:100%;max-width:none}nav{height:auto;min-height:70px;flex-wrap:wrap;padding:10px 0}}.homePage{overflow:hidden}.homeHero{position:relative;min-height:620px;background:linear-gradient(135deg,#f8f8ff,#f5f7ff 45%,#effcf9);border-bottom:1px solid var(--line)}.heroInner{position:relative;z-index:2;padding-top:105px;padding-bottom:75px}.heroBadge,.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:900;color:#625bdb}.heroBadge{display:inline-flex;padding:9px 13px;border:1px solid #dcd9ff;border-radius:999px;background:#fff8}.heroInner h1{font-size:clamp(48px,7vw,82px);letter-spacing:-4px;line-height:.98;margin:22px 0 20px;max-width:900px}.heroInner h1 span{background:linear-gradient(90deg,#635bff,#8b5cf6,#00a98f);-webkit-background-clip:text;color:transparent}.heroLead{font-size:19px;line-height:1.6;color:#667085;max-width:650px}.heroSearch{display:flex;gap:10px;max-width:760px;margin-top:30px}.heroSearchBox{position:relative;flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dfe3ec;border-radius:17px;padding:0 17px;box-shadow:0 15px 45px #35405212}.heroSearchBox input{width:100%;height:56px;border:0;outline:0;background:transparent;font-size:16px}.heroButton{height:58px;padding:0 24px;border-radius:17px}.heroLinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.heroLinks button{border:0;background:transparent;color:#697386;font-weight:700;padding:7px 4px}.heroLinks button:hover{color:#635bff}.orb{position:absolute;border-radius:50%;opacity:.45;pointer-events:none}.orb1{width:340px;height:340px;right:-70px;top:45px;background:#8b5cf633;animation:drift 8s ease-in-out infinite}.orb2{width:220px;height:220px;right:25%;bottom:-100px;background:#00a98f22;animation:drift 10s ease-in-out infinite reverse}@keyframes drift{50%{transform:translate(15px,25px) scale(1.06)}}.trustRow{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;gap:12px}.trustRow div{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px 20px}.trustRow b{font-size:27px;display:block}.trustRow span{color:var(--muted);font-size:13px}.homeSection{padding-top:65px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.sectionHead h2{margin:5px 0;font-size:32px;letter-spacing:-1px}.featureSection{padding:30px 0 55px}.featureCard{border-radius:27px;padding:40px;background:linear-gradient(135deg,#171d2d,#30395b);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:45px;box-shadow:0 25px 60px #26334a20}.featureCard h2{font-size:38px;margin:8px 0}.featureCard p{color:#c7cde0;line-height:1.7}.featureCard .eyebrow{color:#aaa4ff}.steps{display:grid;gap:10px}.steps div{display:flex;align-items:center;gap:18px;border:1px solid #ffffff18;border-radius:16px;padding:15px;background:#ffffff09}.steps b{font-size:12px;color:#aaa4ff}.homeFooter{padding:25px 0 45px;display:flex;justify-content:space-between;color:#8a94a6;font-size:13px}@media(max-width:800px){.homeHero{min-height:auto}.heroInner{padding-top:70px}.heroInner h1{font-size:50px;letter-spacing:-2.5px}.heroSearch{flex-direction:column}.heroButton{width:100%}.trustRow{grid-template-columns:repeat(2,1fr)}.sectionHead{align-items:flex-start;flex-direction:column}.featureCard{grid-template-columns:1fr;padding:28px;gap:25px}}/* safe polish: presentation only */nav{background:linear-gradient(100deg,#ffffffee,#f7f5ffee 52%,#eefbf7ee)!important;border:1px solid #e4e7ef!important;box-shadow:0 8px 28px rgba(30,40,70,.07)!important;backdrop-filter:blur(12px)}#account{display:flex;align-items:center;gap:12px;margin-left:8px;padding-left:14px;border-left:1px solid #dfe3eb}.navbtn{transition:transform .18s ease,box-shadow .18s ease}.navbtn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(30,40,70,.08)}.homePage{background:radial-gradient(circle at 10% 12%,#e9e7ff 0,transparent 25%),radial-gradient(circle at 90% 10%,#def8ef 0,transparent 23%)}.card{transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,40,70,.10)}.profile{background:linear-gradient(135deg,#fff,#f5f3ff 52%,#eefbf7)!important;border:1px solid #e2e6ef!important;box-shadow:0 18px 50px rgba(30,40,70,.09)!important;border-radius:28px!important}.profile .stats,.schoolStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.profile .stat,.schoolStats .stat{padding:17px;border-radius:17px;background:#ffffffb8!important;border:1px solid #fff!important;box-shadow:0 7px 20px rgba(30,40,70,.06)}.modalPage .modalbox{width:min(900px,94vw);min-height:75vh;border-radius:28px;padding:32px;background:linear-gradient(145deg,#fff,#f5f3ff 60%,#eefbf7)}.modalPage .pick{display:flex;gap:8px}.modalPage .pick button{flex:1;padding:14px;border:1px solid #dde2eb;border-radius:13px;background:#fff;font-weight:800}.modalPage .pick button.sel,.modalPage .pick button:hover{background:#635bff;color:#fff;border-color:#635bff}.modalPage textarea{min-height:180px}.modalPage .reviewIntro{padding:10px 0 20px}.schoolStats{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){#account{border-left:0;padding-left:0}.profile .stats,.schoolStats{grid-template-columns:repeat(2,1fr)}.modalPage .modalbox{padding:22px}}</style></head>
<body>
<header><div class="wrap"><nav><button class="navbtn brandHome" type="button" onclick="go('home');return false"><div class="logo">Учитель<b>+</b></div></button><button class="navbtn" type="button" onclick="go('home');return false">Главная</button><button class="navbtn" type="button" onclick="go('schools');return false">Школы</button><button class="navbtn" type="button" onclick="go('teachers');return false">Учителя</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Найти учителя или школу…" oninput="suggest(this.value)" onkeydown="if(event.key==='Enter')doSearch(this.value)"><div id="suggest" class="suggest"></div></div><div id="account"><button class="primary" type="button" onclick="openAuth()">Войти</button></div></nav></div></header>
<main id="app"></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
var db=null,user=null,schools=[],teachers=[],picked=0;
function esc(x){return String(x??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(x){var e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2600)}
function go(page){page=page||'home';var target='#'+page;if(location.hash===target){render();window.scrollTo(0,0);return}location.hash=page;}
function openModal(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').classList.add('open')}
function closeModal(){var m=document.getElementById('modal');m.classList.remove('open');m.classList.remove('modalPage')}
function openAuth(){openModal('<div class="modalhead"><h2 id="authTitle">Войти</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Пароль</label><input id="password" type="password"></div><div id="nameFields" style="display:none"><div class="field"><label>Имя</label><input id="first"></div><div class="field"><label>Фамилия</label><input id="last"></div></div><button class="primary" style="width:100%" onclick="submitAuth()">Продолжить</button><p class="muted" id="authMsg"></p><button class="navbtn" id="switchAuth" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</button>')}
var registerMode=false;
function toggleAuth(){registerMode=!registerMode;document.getElementById('authTitle').textContent=registerMode?'Регистрация':'Войти';document.getElementById('nameFields').style.display=registerMode?'block':'none';document.getElementById('switchAuth').textContent=registerMode?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}
async function submitAuth(){if(!db){toast('Supabase не настроен');return}var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('authMsg');if(registerMode){var first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim();if(!first||!last||password.length<6){msg.textContent='Укажи имя, фамилию и пароль минимум 6 символов.';return}var r=await db.auth.signUp({email:email,password:password,options:{data:{name:first+' '+last,first_name:first,last_name:last}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent='Аккаунт создан. Проверь почту, если подтверждение включено.';user=r.data.user;account();setTimeout(closeModal,500)}else{var r=await db.auth.signInWithPassword({email:email,password:password});if(r.error){msg.textContent=r.error.message;return}user=r.data.user;account();closeModal();toast('Добро пожаловать 👋')}}
async function logout(){if(db)await db.auth.signOut();user=null;account();go('home')}
function account(){document.getElementById('account').innerHTML=user?'<button class="soft" onclick="go(\'profile\')">👤 '+esc(user.user_metadata?.name||user.email)+'</button><button class="soft" onclick="logout()">Выйти</button>':'<button class="primary" onclick="openAuth()">Войти</button>'}
function cardTeacher(t){return '<div class="card"><div class="teacher"><div class="avatar">'+esc(t.initials||t.name.split(' ').map(function(x){return x[0]}).slice(0,2).join(''))+'</div><div><h3>'+esc(t.name)+'</h3><div class="muted">'+esc(t.subject)+'</div><div class="stars">★ '+Number(t.rating||0).toFixed(1)+'</div></div></div><span class="pill">'+esc(t.review_count||0)+' отзывов</span><div class="actions"><button class="primary" onclick="teacher(\''+t.id+'\',location.hash.slice(1)||\'home\')">Профиль</button><button class="soft" onclick="rate(\''+t.id+'\')">Оценить</button></div></div>'}
function home(){
var avg=teachers.length?teachers.reduce(function(a,t){return a+Number(t.rating||0)},0)/teachers.length:0;
return '<div class="homePage"><section class="homeHero"><div class="orb orb1"></div><div class="orb orb2"></div><div class="wrap heroInner"><div class="heroBadge">✦ Платформа доверия к учителям</div><h1>Учителя, которых<br><span>выбирают ученики.</span></h1><p class="heroLead">Находи преподавателей, сравнивай рейтинги и читай реальные отзывы. Всё, чтобы сделать правильный выбор.</p><div class="heroSearch"><div class="heroSearchBox">⌕<input id="heroQ" autocomplete="off" placeholder="Имя учителя, предмет или школа…" oninput="suggest(this.value)" onkeydown="if(event.key===\'Enter\')doSearch(this.value)"><div id="heroSuggest" class="suggest"></div></div><button class="primary heroButton" onclick="doSearch(document.getElementById(\'heroQ\').value)">Найти <span>→</span></button></div><div class="heroLinks"><button onclick="go(\'teachers\')">⭐ Лучшие учителя</button><button onclick="go(\'schools\')">⌖ Все школы</button><button onclick="openAuth()">Создать профиль</button></div></div></section><section class="wrap trustRow"><div><b>'+schools.length+'</b><span>школ</span></div><div><b>'+teachers.length+'</b><span>преподавателей</span></div><div><b>'+(avg?avg.toFixed(1):'—')+'</b><span>средний рейтинг</span></div><div><b>100%</b><span>мнение учеников</span></div></section><section class="wrap section homeSection"><div class="sectionHead"><div><div class="eyebrow">РЕКОМЕНДУЕМ</div><h2>Учителя с высоким рейтингом</h2><p class="muted">Популярные преподаватели прямо сейчас</p></div><button class="soft" onclick="go(\'teachers\')">Смотреть всех →</button></div><div class="grid">'+teachers.slice(0,6).map(cardTeacher).join('')+'</div></section><section class="wrap featureSection"><div class="featureCard"><div><div class="eyebrow">КАК ЭТО РАБОТАЕТ</div><h2>Выбор становится проще.</h2><p>Открой профиль преподавателя, посмотри статистику, оценки и отзывы других учеников — и только потом принимай решение.</p></div><div class="steps"><div><b>01</b><span>Найди учителя или школу</span></div><div><b>02</b><span>Изучи рейтинг и отзывы</span></div><div><b>03</b><span>Поделись своим опытом</span></div></div></div></section><footer class="wrap homeFooter"><span>Учитель+ · честные оценки</span><span>© 2026</span></footer></div>';
}
function schoolsPage(){return '<div class="wrap section"><h2>Школы</h2><p class="muted">Выбери школу и посмотри учителей внутри неё.</p><div class="grid">'+schools.map(function(s){var n=teachers.filter(function(t){return t.school_id===s.id}).length;return '<div class="card school" onclick="school(\''+s.id+'\')"><h3>'+esc(s.name)+'</h3><p class="muted">📍 '+esc(s.city)+'</p><b>'+n+' учителей</b></div>'}).join('')+'</div></div>'}
function teachersPage(list){list=list||teachers;return '<div class="wrap section"><h2>Учителя</h2><div class="grid">'+(list.length?list.map(cardTeacher).join(''):'<div class="empty">Ничего не найдено</div>')+'</div></div>'}
async function teacher(id,from){from=from||'teachers';var t=teachers.find(function(x){return x.id===id});if(!t)return;var reviews=[];if(db){var r=await db.from('reviews').select('rating,comment,created_at').eq('teacher_id',id).order('created_at',{ascending:false}).limit(30);if(!r.error)reviews=r.data||[]}document.getElementById('app').innerHTML='<div class="wrap detail"><button class="soft back" onclick="go(\''+esc(from)+'\')">← Назад</button><div class="profile"><div class="profileTop"><div class="avatar">'+esc(t.initials)+'</div><div><h1>'+esc(t.name)+'</h1><p class="muted">'+esc(t.subject)+'</p><div class="stars">★ '+Number(t.rating||0).toFixed(1)+'</div></div></div><div class="stats"><div class="stat"><b>'+Number(t.rating||0).toFixed(1)+'</b>рейтинг</div><div class="stat"><b>'+esc(t.review_count||0)+'</b>отзывов</div><div class="stat"><b>'+esc(t.recommend_percent||0)+'%</b>рекомендуют</div></div><h3>О преподавателе</h3><p class="muted">'+esc(t.bio||'Информация о преподавателе появится здесь.')+'</p><button class="primary" onclick="rate(\''+t.id+'\')">⭐ Поставить оценку</button><h3 style="margin-top:30px">Отзывы</h3>'+(reviews.length?reviews.map(function(r){return '<div class="card"><div class="stars">'+('★'.repeat(Number(r.rating)))+'</div><p>'+esc(r.comment||'Без комментария')+'</p></div>'}).join(''):'<div class="empty">Пока нет отзывов. Будь первым!</div>')+'</div></div>'}
function school(id,from){from=from||'schools';var s=schools.find(function(x){return x.id===id});if(!s)return;document.getElementById('app').innerHTML='<div class="wrap section"><button class="soft back" onclick="go(\''+esc(from)+'\')">← Школы</button><h1>'+esc(s.name)+'</h1><p class="muted">📍 '+esc(s.city)+' · '+esc(s.address||'')+'</p><div class="stats schoolStats"><div class="stat"><b>'+teachers.filter(function(t){return t.school_id===id}).length+'</b>учителей</div><div class="stat"><b>'+(teachers.filter(function(t){return t.school_id===id}).length? (teachers.filter(function(t){return t.school_id===id}).reduce(function(a,t){return a+Number(t.rating||0)},0)/teachers.filter(function(t){return t.school_id===id}).length).toFixed(1):"—")+'</b>средний рейтинг</div><div class="stat"><b>'+new Set(teachers.filter(function(t){return t.school_id===id}).map(function(t){return t.subject})).size+'</b>предметов</div></div><h2>Учителя школы</h2><div class="grid">'+teachers.filter(function(t){return t.school_id===id}).map(function(t){return cardTeacher(t).replace('onclick="teacher(\\\''+t.id+'\\\')"','onclick="teacher(\\\''+t.id+'\\\',location.hash.slice(1)||\\\'schools\\\')"')}).join('')+'</div></div>'}
function profile(){document.getElementById('app').innerHTML='<div class="wrap detail"><div class="profile"><h1>Мой профиль</h1><p class="muted">'+esc(user?.user_metadata?.name||'Пользователь')+'</p><p>'+esc(user?.email||'')+'</p></div></div>'}
function rate(id){if(!db){toast('Supabase не настроен');return}if(!user){openAuth();toast('Сначала войди в аккаунт');return}var t=teachers.find(function(x){return x.id===id});picked=0;document.getElementById('modal').classList.add('modalPage');openModal('<div class="modalhead"><h2>Оценить '+esc(t.name)+'</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Твоя оценка останется привязанной к аккаунту.</p><div class="field"><label>Оценка</label><div class="pick">'+[1,2,3,4,5].map(function(n){return '<button onclick="pick('+n+')">'+n+' ★</button>'}).join('')+'</div></div><div class="field"><label>Отзыв</label><textarea id="comment" maxlength="1000" placeholder="Расскажи о преподавателе…"></textarea></div><button class="primary" style="width:100%" onclick="sendReview(\''+id+'\')">Опубликовать</button><p id="rateMsg" class="muted"></p>')}
function pick(n){picked=n;document.querySelectorAll('.pick button').forEach(function(b,i){b.classList.toggle('sel',i<n)})}
async function sendReview(id){if(!user||!db)return;if(!picked){toast('Выбери оценку');return}var r=await db.from('reviews').insert({teacher_id:id,user_id:user.id,rating:picked,comment:document.getElementById('comment').value.trim()});if(r.error){document.getElementById('rateMsg').textContent=r.error.message;return}closeModal();toast('Оценка сохранена ⭐');await loadData();teacher(id)}
function suggest(q){q=q.trim().toLowerCase();var e=document.getElementById('suggest');if(!q){e.classList.remove('show');return}var a=teachers.filter(function(t){return t.name.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q)}).slice(0,4).map(function(t){return '<div onclick="teacher(\''+t.id+'\');hideSuggest()"><b>👤 '+esc(t.name)+'</b><br><span class="muted">'+esc(t.subject)+'</span></div>'});a=a.concat(schools.filter(function(s){return s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q)}).slice(0,3).map(function(s){return '<div onclick="school(\''+s.id+'\');hideSuggest()"><b>🏫 '+esc(s.name)+'</b><br><span class="muted">'+esc(s.city)+'</span></div>'}));e.innerHTML=a.join('')||'<div class="muted">Ничего не найдено</div>';e.classList.add('show')}
function hideSuggest(){document.getElementById('suggest').classList.remove('show')}
function doSearch(q){hideSuggest();q=q.trim().toLowerCase();go('teachers');setTimeout(function(){var x=teachers.filter(function(t){var s=schools.find(function(s){return s.id===t.school_id});return t.name.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q)||(s&&s.name.toLowerCase().includes(q))});document.getElementById('app').innerHTML=teachersPage(x)},0)}
async function loadData(){try{var cfg=window.RUNTIME_CONFIG||{supabaseUrl:'https://jjzjmwvnhxwwxlyeeciz.supabase.co',supabaseAnonKey:'sb_publishable_qGUsVfVJdUXHLSUDt4jwhA_Zmlc7_QY'};if(!window.supabase)throw Error('SDK Supabase не загрузился');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Supabase configuration is empty');db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{db:{schema:'public'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});var session=await db.auth.getSession();user=session.data.session?.user||null;account();var sr=await db.from('schools').select('*').order('name');var tr=await db.from('teachers').select('*').order('rating',{ascending:false});if(!sr.error)schools=sr.data||[];else console.error('schools:',sr.error);if(!tr.error)teachers=tr.data||[];else console.error('teachers:',tr.error);render();db.auth.onAuthStateChange(function(_,s){user=s?.user||null;account()})}catch(e){console.error(e);render();toast('Не удалось подключить Supabase: '+e.message)}}
function render(){var p=(location.hash||'#home').slice(1).split('?')[0]||'home';var app=document.getElementById('app');if(!app)return;try{if(p==='schools')app.innerHTML=schoolsPage();else if(p==='teachers')app.innerHTML=teachersPage();else if(p==='profile'&&user)profile();else app.innerHTML=home();}catch(e){console.error(e);app.innerHTML='<div class="wrap section"><div class="empty"><h2>Не удалось открыть страницу</h2><p>Попробуй обновить страницу.</p><button class="primary" onclick="go(\'home\')">На главную</button></div></div>';}}
window.addEventListener('hashchange',render);window.addEventListener('popstate',render);window.addEventListener('popstate',render);document.addEventListener('click',function(e){if(!e.target.closest('.search'))hideSuggest()});loadData();
</script></body></html>
