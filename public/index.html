<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учитель+ — рейтинг учителей</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/runtime-config.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#152033;--muted:#718096;--line:#e6eaf1;--brand:#635bff;--brand2:#8b5cf6;--good:#00a98f;--shadow:0 16px 45px rgba(30,40,70,.1)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 0 0,#e9e7ff,transparent 65%),radial-gradient(700px 400px at 100% 0,#dcfaf4,transparent 65%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}nav{height:70px;display:flex;align-items:center;gap:18px}.logo{font-size:21px;font-weight:900}.logo b{color:var(--brand)}.search{flex:1;position:relative;max-width:560px}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 15px 0 42px;background:#f9fafc;outline:0}.search span{position:absolute;left:14px;top:11px}.suggest{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;display:none}.suggest.show{display:block}.suggest div{padding:12px 15px}.suggest div:hover{background:#f5f6ff}.navbtn{border:0;background:transparent;font-weight:700}.primary{background:var(--brand);color:white;border:0;border-radius:12px;padding:11px 17px;font-weight:800}.soft{background:#eef0ff;color:#4e46d9;border:0;border-radius:12px;padding:11px 15px;font-weight:800}
main{min-height:calc(100vh - 70px)}.hero{padding:72px 0 42px}.hero h1{font-size:clamp(38px,6vw,68px);line-height:.98;letter-spacing:-3px;margin:0 0 20px;max-width:800px}.hero p{font-size:18px;color:var(--muted);max-width:650px}.heroSearch{display:flex;gap:10px;max-width:720px;margin-top:28px}.heroSearch input{flex:1;border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--shadow);outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px #26334a08}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);transition:.2s}.section{padding:30px 0 60px}.section h2{font-size:30px;margin:0 0 20px}.muted{color:var(--muted)}.stars{color:#e4a514;font-weight:900}.teacher{display:flex;gap:14px;align-items:flex-start}.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#635bff,#9b8cff);color:#fff;display:grid;place-items:center;font-weight:900}.teacher h3{margin:0 0 5px}.pill{display:inline-block;padding:5px 9px;border-radius:9px;background:#f0f2f8;color:#59657a;font-size:12px;font-weight:700;margin-top:8px}.actions{display:flex;gap:8px;margin-top:15px}.list{display:grid;gap:12px}.school{cursor:pointer}.empty{padding:45px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccd3df;border-radius:20px}
.detail{max-width:900px;padding:45px 0}.back{margin-bottom:18px}.profile{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.profileTop{display:flex;gap:20px;align-items:center}.profile .avatar{width:88px;height:88px;font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{padding:15px;background:#f7f8fc;border-radius:14px}.stat b{font-size:24px;display:block}
.modal{position:fixed;inset:0;background:#17203355;backdrop-filter:blur(5px);display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;border-radius:22px;padding:25px;width:min(460px,100%);box-shadow:0 30px 80px #11182744}.modalhead{display:flex;justify-content:space-between}.close{border:0;background:#f1f3f7;border-radius:10px;width:36px;height:36px}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}.field textarea{min-height:100px;resize:vertical}.pick{display:flex;gap:7px}.pick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}.pick button.sel{background:#fff4d5;border-color:#e4a514}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#152033;color:white;padding:12px 17px;border-radius:12px;display:none;z-index:70}.toast.show{display:block}
@media(max-width:800px){.grid{grid-template-columns:1fr}.navbtn{display:none}.hero{padding-top:45px}.stats{grid-template-columns:1fr}.heroSearch{flex-direction:column}.search{max-width:none}.profileTop{align-items:flex-start}}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:linear-gradient(135deg,#635bff33,#00a98f22);right:4%;top:30px;filter:blur(3px);animation:float 7s ease-in-out infinite;pointer-events:none}@keyframes float{50%{transform:translateY(20px) scale(1.05)}}.card,.profile{transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-4px)}.section{animation:pagein .3s ease}@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.profile h1{font-size:clamp(30px,5vw,48px);margin:0}.profile .bio{font-size:17px;line-height:1.7}.teacherMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.heroSearch{position:relative;z-index:2}.school .pill{margin-bottom:10px}</style></head>
<body>
<header><div class="wrap"><nav><div class="logo">Учитель<b>+</b></div><button class="navbtn" onclick="go('home')">Главная</button><button class="navbtn" onclick="go('schools')">Школы</button><button class="navbtn" onclick="go('teachers')">Учителя</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Найти учителя или школу…" oninput="suggest(this.value)" onkeydown="if(event.key==='Enter')doSearch(this.value)"><div id="suggest" class="suggest"></div></div><div id="account"><button class="primary" onclick="openAuth()">Войти</button></div></nav></div></header>
<main id="app"></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
var db=null,user=null,schools=[],teachers=[],picked=0;
function esc(x){return String(x??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(x){var e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2600)}
function go(page){if(location.hash.slice(1)===page){render();return}history.pushState({page:page},'', '#'+page);render();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openAuth(){openModal('<div class="modalhead"><h2 id="authTitle">Войти</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Пароль</label><input id="password" type="password"></div><div id="nameFields" style="display:none"><div class="field"><label>Имя</label><input id="first"></div><div class="field"><label>Фамилия</label><input id="last"></div></div><button class="primary" style="width:100%" onclick="submitAuth()">Продолжить</button><p class="muted" id="authMsg"></p><button class="navbtn" id="switchAuth" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</button>')}
var registerMode=false;
function toggleAuth(){registerMode=!registerMode;document.getElementById('authTitle').textContent=registerMode?'Регистрация':'Войти';document.getElementById('nameFields').style.display=registerMode?'block':'none';document.getElementById('switchAuth').textContent=registerMode?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}
async function submitAuth(){if(!db){toast('Supabase не настроен');return}var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('authMsg');if(registerMode){var first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim();if(!first||!last||password.length<6){msg.textContent='Укажи имя, фамилию и пароль минимум 6 символов.';return}var r=await db.auth.signUp({email:email,password:password,options:{data:{name:first+' '+last,first_name:first,last_name:last}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent='Аккаунт создан. Проверь почту, если подтверждение включено.';user=r.data.user;account();setTimeout(closeModal,500)}else{var r=await db.auth.signInWithPassword({email:email,password:password});if(r.error){msg.textContent=r.error.message;return}user=r.data.user;account();closeModal();toast('Добро пожаловать 👋')}}
async function logout(){if(db)await db.auth.signOut();user=null;account();go('home')}
function account(){document.getElementById('account').innerHTML=user?'<button class="soft" onclick="go(\'profile\')">👤 '+esc(user.user_metadata?.name||user.email)+'</button><button class="soft" onclick="logout()">Выйти</button>':'<button class="primary" onclick="openAuth()">Войти</button>'}
function cardTeacher(t){return '<div class="card"><div class="teacher"><div class="avatar">'+esc(t.initials||t.name.split(' ').map(function(x){return x[0]}).slice(0,2).join(''))+'</div><div><h3>'+esc(t.name)+'</h3><div class="muted">'+esc(t.subject)+'</div><div class="stars">★ '+Number(t.rating||0).toFixed(1)+'</div></div></div><span class="pill">'+esc(t.review_count||0)+' отзывов</span><div class="actions"><button class="primary" onclick="teacher(\''+t.id+'\')">Профиль</button><button class="soft" onclick="rate(\''+t.id+'\')">Оценить</button></div></div>'}
function home(){return '<div class="wrap"><section class="hero"><div class="pill">✨ Рейтинг учителей нового поколения</div><h1>Найди учителя,<br>которому доверяют.</h1><p>Реальные оценки учеников, отзывы и школы — всё в одном месте.</p><div class="heroSearch"><input placeholder="Имя учителя, предмет или школа…" onkeydown="if(event.key===\'Enter\')doSearch(this.value)"><button class="primary" onclick="doSearch(document.querySelector(\'.heroSearch input\').value)">Найти</button></div></section><section class="section"><h2>Популярные учителя</h2><div class="grid">'+teachers.slice(0,6).map(cardTeacher).join('')+'</div></section></div>'}
function schoolsPage(){return '<div class="wrap section"><h2>Школы</h2><p class="muted">Выбери школу и посмотри учителей внутри неё.</p><div class="grid">'+schools.map(function(s){var n=teachers.filter(function(t){return t.school_id===s.id}).length;return '<div class="card school" onclick="school(\''+s.id+'\')"><h3>'+esc(s.name)+'</h3><p class="muted">📍 '+esc(s.city)+'</p><b>'+n+' учителей</b></div>'}).join('')+'</div></div>'}
function teachersPage(list){list=list||teachers;return '<div class="wrap section"><h2>Учителя</h2><div class="grid">'+(list.length?list.map(cardTeacher).join(''):'<div class="empty">Ничего не найдено</div>')+'</div></div>'}
async function teacher(id){var t=teachers.find(function(x){return x.id===id});if(!t)return;var reviews=[];if(db){var r=await db.from('reviews').select('rating,comment,created_at').eq('teacher_id',id).order('created_at',{ascending:false}).limit(30);if(!r.error)reviews=r.data||[]}document.getElementById('app').innerHTML='<div class="wrap detail"><button class="soft back" onclick="go(\'teachers\')">← Назад</button><div class="profile"><div class="profileTop"><div class="avatar">'+esc(t.initials)+'</div><div><h1>'+esc(t.name)+'</h1><p class="muted">'+esc(t.subject)+'</p><div class="stars">★ '+Number(t.rating||0).toFixed(1)+'</div></div></div><div class="stats"><div class="stat"><b>'+Number(t.rating||0).toFixed(1)+'</b>рейтинг</div><div class="stat"><b>'+esc(t.review_count||0)+'</b>отзывов</div><div class="stat"><b>'+esc(t.recommend_percent||0)+'%</b>рекомендуют</div></div><h3>О преподавателе</h3><p class="muted">'+esc(t.bio||'Информация о преподавателе появится здесь.')+'</p><button class="primary" onclick="rate(\''+t.id+'\')">⭐ Поставить оценку</button><h3 style="margin-top:30px">Отзывы</h3>'+(reviews.length?reviews.map(function(r){return '<div class="card"><div class="stars">'+('★'.repeat(Number(r.rating)))+'</div><p>'+esc(r.comment||'Без комментария')+'</p></div>'}).join(''):'<div class="empty">Пока нет отзывов. Будь первым!</div>')+'</div></div>'}
function school(id){var s=schools.find(function(x){return x.id===id});if(!s)return;document.getElementById('app').innerHTML='<div class="wrap section"><button class="soft back" onclick="go(\'schools\')">← Школы</button><h1>'+esc(s.name)+'</h1><p class="muted">📍 '+esc(s.city)+' · '+esc(s.address||'')+'</p><h2>Учителя школы</h2><div class="grid">'+teachers.filter(function(t){return t.school_id===id}).map(cardTeacher).join('')+'</div></div>'}
function profile(){document.getElementById('app').innerHTML='<div class="wrap detail"><div class="profile"><h1>Мой профиль</h1><p class="muted">'+esc(user?.user_metadata?.name||'Пользователь')+'</p><p>'+esc(user?.email||'')+'</p></div></div>'}
function rate(id){if(!db){toast('Supabase не настроен');return}if(!user){openAuth();toast('Сначала войди в аккаунт');return}var t=teachers.find(function(x){return x.id===id});picked=0;openModal('<div class="modalhead"><h2>Оценить '+esc(t.name)+'</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Твоя оценка останется привязанной к аккаунту.</p><div class="field"><label>Оценка</label><div class="pick">'+[1,2,3,4,5].map(function(n){return '<button onclick="pick('+n+')">'+n+' ★</button>'}).join('')+'</div></div><div class="field"><label>Отзыв</label><textarea id="comment" maxlength="1000" placeholder="Расскажи о преподавателе…"></textarea></div><button class="primary" style="width:100%" onclick="sendReview(\''+id+'\')">Опубликовать</button><p id="rateMsg" class="muted"></p>')}
function pick(n){picked=n;document.querySelectorAll('.pick button').forEach(function(b,i){b.classList.toggle('sel',i<n)})}
async function sendReview(id){if(!user||!db)return;if(!picked){toast('Выбери оценку');return}var r=await db.from('reviews').insert({teacher_id:id,user_id:user.id,rating:picked,comment:document.getElementById('comment').value.trim()});if(r.error){document.getElementById('rateMsg').textContent=r.error.message;return}closeModal();toast('Оценка сохранена ⭐');await loadData();teacher(id)}
function suggest(q){q=q.trim().toLowerCase();var e=document.getElementById('suggest');if(!q){e.classList.remove('show');return}var a=teachers.filter(function(t){return t.name.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q)}).slice(0,4).map(function(t){return '<div onclick="teacher(\''+t.id+'\');hideSuggest()"><b>👤 '+esc(t.name)+'</b><br><span class="muted">'+esc(t.subject)+'</span></div>'});a=a.concat(schools.filter(function(s){return s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q)}).slice(0,3).map(function(s){return '<div onclick="school(\''+s.id+'\');hideSuggest()"><b>🏫 '+esc(s.name)+'</b><br><span class="muted">'+esc(s.city)+'</span></div>'}));e.innerHTML=a.join('')||'<div class="muted">Ничего не найдено</div>';e.classList.add('show')}
function hideSuggest(){document.getElementById('suggest').classList.remove('show')}
function doSearch(q){hideSuggest();q=q.trim().toLowerCase();go('teachers');setTimeout(function(){var x=teachers.filter(function(t){var s=schools.find(function(s){return s.id===t.school_id});return t.name.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q)||(s&&s.name.toLowerCase().includes(q))});document.getElementById('app').innerHTML=teachersPage(x)},0)}
async function loadData(){try{var cfg=window.RUNTIME_CONFIG||{supabaseUrl:'https://jjzjmwvnhxwwxlyeeciz.supabase.co',supabaseAnonKey:'sb_publishable_qGUsVfVJdUXHLSUDt4jwhA_Zmlc7_QY'};if(!window.supabase)throw Error('SDK Supabase не загрузился');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Supabase configuration is empty');db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{db:{schema:'public'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});var session=await db.auth.getSession();user=session.data.session?.user||null;account();var sr=await db.from('schools').select('*').order('name');var tr=await db.from('teachers').select('*').order('rating',{ascending:false});if(!sr.error)schools=sr.data||[];else console.error('schools:',sr.error);if(!tr.error)teachers=tr.data||[];else console.error('teachers:',tr.error);render();db.auth.onAuthStateChange(function(_,s){user=s?.user||null;account()})}catch(e){console.error(e);render();toast('Не удалось подключить Supabase: '+e.message)}}
function render(){var p=location.hash.slice(1)||'home';if(p==='schools')document.getElementById('app').innerHTML=schoolsPage();else if(p==='teachers')document.getElementById('app').innerHTML=teachersPage();else if(p==='profile'&&user)profile();else home();}
window.addEventListener('hashchange',render);window.addEventListener('popstate',render);document.addEventListener('click',function(e){if(!e.target.closest('.search'))hideSuggest()});loadData();
</script></body></html>
